<svg class="fig" viewBox="0 0 760 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>Verloop van een verbinding</title><desc>Zes stappen: luisteren, vragen of de frequentie vrij is, CQ roepen, antwoord, uitwijken, afsluiten.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="20" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="48" r="20" class="sb"/><text x="55" y="54" class="lbl b" text-anchor="middle">1</text><text x="110" y="44" class="lbl b" text-anchor="start">Luisteren</text><text x="110" y="64" class="lbl s" text-anchor="start">is de frequentie vrij? Luister eerst een tijdje.</text><rect x="90" y="94" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="122" r="20" class="sb"/><text x="55" y="128" class="lbl b" text-anchor="middle">2</text><text x="110" y="118" class="lbl b" text-anchor="start">Vragen</text><text x="110" y="138" class="lbl s" text-anchor="start">"Is deze frequentie in gebruik? Dit is ON3XYZ."</text><rect x="90" y="168" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="196" r="20" class="sb"/><text x="55" y="202" class="lbl b" text-anchor="middle">3</text><text x="110" y="192" class="lbl b" text-anchor="start">Oproepen (CQ)</text><text x="110" y="212" class="lbl s" text-anchor="start">"CQ CQ CQ, dit is ON3XYZ ... die roept en luistert."</text><rect x="90" y="242" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="270" r="20" class="sb"/><text x="55" y="276" class="lbl b" text-anchor="middle">4</text><text x="110" y="266" class="lbl b" text-anchor="start">Iemand antwoordt</text><text x="110" y="286" class="lbl s" text-anchor="start">noteer zijn roepnaam, geef een rapport</text><rect x="90" y="316" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="344" r="20" class="sb"/><text x="55" y="350" class="lbl b" text-anchor="middle">5</text><text x="110" y="340" class="lbl b" text-anchor="start">Uitwijken (QSY)</text><text x="110" y="360" class="lbl s" text-anchor="start">op VHF/UHF: weg van de oproepfrequentie</text><rect x="90" y="390" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="418" r="20" class="sb"/><text x="55" y="424" class="lbl b" text-anchor="middle">6</text><text x="110" y="414" class="lbl b" text-anchor="start">Afsluiten</text><text x="110" y="434" class="lbl s" text-anchor="start">groeten, roepnamen herhalen, in het logboek</text></svg>