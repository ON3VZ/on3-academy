<svg class="fig" viewBox="0 0 760 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne als omzetter</title><desc>Links zet de antenne een elektrisch signaal om in een radiogolf, rechts gebeurt het omgekeerde.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="70" width="120" height="60" rx="10" class="box"/><text x="80.0" y="105.0" class="lbl b" text-anchor="middle">zender</text><line x1="140" y1="100" x2="230" y2="100" class="feed"/><line x1="230" y1="100" x2="230" y2="60" class="feed"/><line x1="230" y1="60" x2="230" y2="20" class="ant"/><line x1="230" y1="34" x2="214" y2="14" class="ant"/><line x1="230" y1="34" x2="246" y2="14" class="ant"/><path d="M250.8,15.6 A18,18 0 0 1 250.8,44.4" class="w-amber"/><path d="M260.4,2.8 A34,34 0 0 1 260.4,57.2" class="w-amber"/><path d="M270.0,-10.0 A50,50 0 0 1 270.0,70.0" class="w-amber"/><path d="M279.6,-22.8 A66,66 0 0 1 279.6,82.8" class="w-amber"/><line x1="530" y1="60" x2="530" y2="20" class="ant"/><line x1="530" y1="34" x2="514" y2="14" class="ant"/><line x1="530" y1="34" x2="546" y2="14" class="ant"/><path d="M509.2,15.6 A18,18 0 0 0 509.2,44.4" class="w-amber"/><path d="M499.6,2.8 A34,34 0 0 0 499.6,57.2" class="w-amber"/><path d="M490.0,-10.0 A50,50 0 0 0 490.0,70.0" class="w-amber"/><path d="M480.4,-22.8 A66,66 0 0 0 480.4,82.8" class="w-amber"/><line x1="530" y1="60" x2="530" y2="100" class="feed"/><line x1="530" y1="100" x2="620" y2="100" class="feed"/><rect x="620" y="70" width="120" height="60" rx="10" class="box"/><text x="680.0" y="105.0" class="lbl b" text-anchor="middle">ontvanger</text><text x="380" y="30" class="lbl b accent2" text-anchor="middle">radiogolf</text><line x1="330" y1="60" x2="430" y2="60" class="arrow" marker-end="url(#pijl)"/><text x="185" y="150" class="lbl s" text-anchor="middle">elektrisch</text><text x="185" y="166" class="lbl s" text-anchor="middle">signaal</text><text x="575" y="150" class="lbl s" text-anchor="middle">elektrisch</text><text x="575" y="166" class="lbl s" text-anchor="middle">signaal</text><text x="230" y="200" class="lbl b" text-anchor="middle">zendantenne: elektrisch → golf</text><text x="530" y="200" class="lbl b" text-anchor="middle">ontvangstantenne: golf → elektrisch</text></svg>