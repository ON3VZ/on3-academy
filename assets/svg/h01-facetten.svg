<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Wat doet een radioamateur</title><desc>Vier vakken: verbindingen over de hele wereld, zelf bouwen, experimenteren, propagatie. Daaronder: geen commercie, geen politiek of geloof.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="30" width="350" height="110" rx="12" class="box"/><text x="195" y="72" class="lbl b" text-anchor="middle">verbindingen</text><text x="195" y="98" class="lbl s" text-anchor="middle">met amateurs over de</text><text x="195" y="116" class="lbl s" text-anchor="middle">hele wereld</text><rect x="390" y="30" width="350" height="110" rx="12" class="box"/><text x="565" y="72" class="lbl b" text-anchor="middle">zelf bouwen</text><text x="565" y="98" class="lbl s" text-anchor="middle">antennes en toestellen</text><text x="565" y="116" class="lbl s" text-anchor="middle">maken en verbeteren</text><rect x="20" y="160" width="350" height="110" rx="12" class="box"/><text x="195" y="202" class="lbl b" text-anchor="middle">experimenteren</text><text x="195" y="228" class="lbl s" text-anchor="middle">nieuwe technieken</text><text x="195" y="246" class="lbl s" text-anchor="middle">en digitale modes</text><rect x="390" y="160" width="350" height="110" rx="12" class="box"/><text x="565" y="202" class="lbl b" text-anchor="middle">propagatie</text><text x="565" y="228" class="lbl s" text-anchor="middle">begrijpen hoe ver</text><text x="565" y="246" class="lbl s" text-anchor="middle">radiogolven komen</text><text x="380" y="292" class="lbl b red" text-anchor="middle">niet toegelaten: commercie (geld verdienen). Taboe: politiek en geloof.</text></svg>