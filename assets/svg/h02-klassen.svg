<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Drie klassen</title><desc>Drie trappen: klasse C (8 banden, 25 tot 50 W), klasse B (12 banden, 100 W), klasse A (26 of meer banden, 1500 W, zelf bouwen).</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="30" y="130" width="220" height="140" rx="10" class="box"/><text x="140" y="164" class="lbl big" text-anchor="middle">klasse C</text><text x="140" y="186" class="lbl s" text-anchor="middle">basiscertificaat</text><text x="140" y="212" class="lbl b" text-anchor="middle">8 banden</text><text x="140" y="232" class="lbl s" text-anchor="middle">25 W HF, 50 W VHF/UHF</text><text x="140" y="254" class="lbl s" text-anchor="middle">enkel gekochte toestellen</text><rect x="270" y="90" width="220" height="180" rx="10" class="box"/><text x="380" y="124" class="lbl big" text-anchor="middle">klasse B</text><text x="380" y="146" class="lbl s" text-anchor="middle">CEPT Novice</text><text x="380" y="172" class="lbl b" text-anchor="middle">12 banden</text><text x="380" y="192" class="lbl s" text-anchor="middle">max 100 W</text><text x="380" y="214" class="lbl s" text-anchor="middle">gekochte toestellen, niet wijzigen</text><rect x="510" y="50" width="220" height="220" rx="10" class="box"/><text x="620" y="84" class="lbl big" text-anchor="middle">klasse A</text><text x="620" y="106" class="lbl s" text-anchor="middle">HAREC</text><text x="620" y="132" class="lbl b" text-anchor="middle">26 of meer banden</text><text x="620" y="152" class="lbl s" text-anchor="middle">max 1500 W</text><text x="620" y="174" class="lbl s" text-anchor="middle">zelf bouwen en wijzigen mag</text><line x1="40" y1="20" x2="720" y2="20" class="arrow" marker-end="url(#pijl)"/><text x="380" y="14" class="lbl s" text-anchor="middle">hoe hoger de klasse, hoe meer banden en vermogen</text></svg>