<svg class="fig" viewBox="0 0 760 120" role="img" xmlns="http://www.w3.org/2000/svg"><title>Data zenden</title><desc>Computer naar modem of TNC dat bits omzet in twee audiotonen, dan naar de zender.</desc><rect x="20" y="25" width="200" height="66" rx="10" class="box"/><text x="120" y="54" class="lbl b" text-anchor="middle">computer</text><text x="120" y="76" class="lbl s" text-anchor="middle">bits 0 en 1</text><rect x="270" y="25" width="200" height="66" rx="10" class="box"/><text x="370" y="54" class="lbl b" text-anchor="middle">modem / TNC</text><text x="370" y="76" class="lbl s" text-anchor="middle">2 audiotonen</text><rect x="520" y="25" width="200" height="66" rx="10" class="box"/><text x="620" y="54" class="lbl b" text-anchor="middle">zender</text><text x="620" y="76" class="lbl s" text-anchor="middle">SSB of FM</text><line x1="220" y1="58" x2="268" y2="58" class="arrow" marker-end="url(#ah2)"/><line x1="470" y1="58" x2="518" y2="58" class="arrow" marker-end="url(#ah2)"/><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs></svg>