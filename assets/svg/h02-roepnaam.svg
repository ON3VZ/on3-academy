<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Opbouw van een roepnaam</title><desc>Een roepnaam bestaat uit landprefix ON, een cijfer 3, letters XYZ en eventueel een aanhangsel /P.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="60" y="40" width="160" height="80" rx="10" class="sb"/><text x="140.0" y="96" class="lbl big mono" text-anchor="middle">ON</text><text x="140.0" y="150" class="lbl b" text-anchor="middle">land</text><text x="140.0" y="172" class="lbl s" text-anchor="middle">België: ON tot OT</text><rect x="240" y="40" width="90" height="80" rx="10" class="sb"/><text x="285.0" y="96" class="lbl big mono" text-anchor="middle">3</text><text x="285.0" y="150" class="lbl b" text-anchor="middle">cijfer</text><text x="285.0" y="172" class="lbl s" text-anchor="middle">één cijfer</text><rect x="350" y="40" width="170" height="80" rx="10" class="sb"/><text x="435.0" y="96" class="lbl big mono" text-anchor="middle">XYZ</text><text x="435.0" y="150" class="lbl b" text-anchor="middle">letters</text><text x="435.0" y="172" class="lbl s" text-anchor="middle">één tot drie letters</text><rect x="540" y="40" width="140" height="80" rx="10" class="cell"/><text x="610.0" y="96" class="lbl big mono" text-anchor="middle">/P</text><text x="610.0" y="150" class="lbl b" text-anchor="middle">aanhangsel</text><text x="610.0" y="172" class="lbl s" text-anchor="middle">waar je zendt (soms)</text><text x="380" y="214" class="lbl b accent2" text-anchor="middle">ON3XYZ/P = Belgische radioamateur, draagbaar station</text></svg>