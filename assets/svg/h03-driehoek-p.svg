<svg class="fig" viewBox="0 0 760 270" role="img" xmlns="http://www.w3.org/2000/svg"><title>Driehoek van vermogen</title><desc>Driehoek met P boven, U en I onder. Bedek wat je zoekt.</desc><path d="M120,20 L220,200 L20,200 Z" class="tri"/><line x1="65" y1="120" x2="175" y2="120" class="triline"/><line x1="120" y1="120" x2="120" y2="200" class="triline"/><text x="120" y="98" class="lbl trilbl" text-anchor="middle">P</text><text x="75" y="178" class="lbl trilbl" text-anchor="middle">U</text><text x="165" y="178" class="lbl trilbl" text-anchor="middle">I</text><text x="120" y="232" class="lbl b" text-anchor="middle">de driehoek</text><g transform="translate(270,40) scale(0.62)"><path d="M110,20 L210,200 L10,200 Z" class="tri"/><line x1="55" y1="120" x2="165" y2="120" class="triline"/><line x1="110" y1="120" x2="110" y2="200" class="triline"/><text x="110" y="98" class="lbl trilbl dim2" text-anchor="middle">P</text><text x="65" y="178" class="lbl trilbl" text-anchor="middle">U</text><text x="155" y="178" class="lbl trilbl" text-anchor="middle">I</text><rect x="84" y="58" width="52" height="50" rx="10" class="finger"/></g><text x="338" y="200" class="lbl b mono" text-anchor="middle">P = U × I</text><g transform="translate(435,40) scale(0.62)"><path d="M110,20 L210,200 L10,200 Z" class="tri"/><line x1="55" y1="120" x2="165" y2="120" class="triline"/><line x1="110" y1="120" x2="110" y2="200" class="triline"/><text x="110" y="98" class="lbl trilbl" text-anchor="middle">P</text><text x="65" y="178" class="lbl trilbl dim2" text-anchor="middle">U</text><text x="155" y="178" class="lbl trilbl" text-anchor="middle">I</text><rect x="39" y="138" width="52" height="50" rx="10" class="finger"/></g><text x="503" y="200" class="lbl b mono" text-anchor="middle">U = P ÷ I</text><g transform="translate(600,40) scale(0.62)"><path d="M110,20 L210,200 L10,200 Z" class="tri"/><line x1="55" y1="120" x2="165" y2="120" class="triline"/><line x1="110" y1="120" x2="110" y2="200" class="triline"/><text x="110" y="98" class="lbl trilbl" text-anchor="middle">P</text><text x="65" y="178" class="lbl trilbl" text-anchor="middle">U</text><text x="155" y="178" class="lbl trilbl dim2" text-anchor="middle">I</text><rect x="129" y="138" width="52" height="50" rx="10" class="finger"/></g><text x="668" y="200" class="lbl b mono" text-anchor="middle">I = P ÷ U</text><text x="515" y="240" class="lbl s" text-anchor="middle">Leg je vinger op wat je zoekt. Wat overblijft, is de formule.</text></svg>