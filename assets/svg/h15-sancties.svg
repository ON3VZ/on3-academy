<svg class="fig" viewBox="0 0 760 430" role="img" xmlns="http://www.w3.org/2000/svg"><title>Straffen in de wet</title><desc>Tabel met de straffen van artikel 145: paragraaf 1 boete 50 tot 50 000 euro; paragraaf 2 boete 200 tot 2 000 euro en 8 dagen tot 1 jaar; paragraaf 3 boete 500 tot 50 000 euro en 1 tot 4 jaar; paragraaf 3bis 50 tot 300 euro en 15 dagen tot 2 jaar; paragraaf 4 verbeurdverklaring.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="22" class="lbl b" text-anchor="start">Wet van 13 juni 2005, art. 145</text><text x="110" y="50" class="lbl s b" text-anchor="start">geldboete</text><text x="290" y="50" class="lbl s b" text-anchor="start">gevangenis</text><text x="450" y="50" class="lbl s b" text-anchor="start">waarvoor?</text><rect x="10" y="60" width="740" height="60" rx="8" class="box"/><text x="24" y="96" class="lbl b mono accent2" text-anchor="start">§ 1</text><text x="110" y="96" class="lbl b" text-anchor="start">50 tot 50 000 EUR</text><text x="290" y="96" class="lbl b red" text-anchor="start"></text><text x="450" y="87" class="lbl s" text-anchor="start">storing, apparatuur, noodseinen,</text><text x="450" y="106" class="lbl s" text-anchor="start">afluisteren, verkoop (15, 32, 33, 35, 41, 42)</text><rect x="10" y="130" width="740" height="60" rx="8" class="cell"/><text x="24" y="166" class="lbl b mono accent2" text-anchor="start">§ 2</text><text x="110" y="166" class="lbl b" text-anchor="start">200 tot 2 000 EUR</text><text x="290" y="166" class="lbl b red" text-anchor="start">8 dagen tot 1 jaar</text><text x="450" y="157" class="lbl s" text-anchor="start">zender houden of gebruiken zonder</text><text x="450" y="176" class="lbl s" text-anchor="start">vergunning (13/1)</text><rect x="10" y="200" width="740" height="60" rx="8" class="box"/><text x="24" y="236" class="lbl b mono accent2" text-anchor="start">§ 3</text><text x="110" y="236" class="lbl b" text-anchor="start">500 tot 50 000 EUR</text><text x="290" y="236" class="lbl b red" text-anchor="start">1 tot 4 jaar</text><text x="450" y="227" class="lbl s" text-anchor="start">bedrieglijk communiceren om</text><text x="450" y="246" class="lbl s" text-anchor="start">voordeel te halen</text><rect x="10" y="270" width="740" height="60" rx="8" class="cell"/><text x="24" y="306" class="lbl b mono accent2" text-anchor="start">§ 3bis</text><text x="110" y="306" class="lbl b" text-anchor="start">50 tot 300 EUR</text><text x="290" y="306" class="lbl b red" text-anchor="start">15 dagen tot 2 jaar</text><text x="450" y="297" class="lbl s" text-anchor="start">overlast of schade aan je</text><text x="450" y="316" class="lbl s" text-anchor="start">correspondent</text><rect x="10" y="340" width="740" height="60" rx="8" class="box"/><text x="24" y="376" class="lbl b mono accent2" text-anchor="start">§ 4</text><text x="110" y="376" class="lbl b" text-anchor="start">verbeurdverklaring</text><text x="290" y="376" class="lbl b red" text-anchor="start">altijd</text><text x="450" y="367" class="lbl s" text-anchor="start">toestel dat niet voldoet aan art.</text><text x="450" y="386" class="lbl s" text-anchor="start">32, 33, 35 of 37</text><text x="380" y="420" class="lbl s" text-anchor="middle">Gevangenisstraf en boete samen, of één van beide (behalve § 1 en § 4).</text></svg>