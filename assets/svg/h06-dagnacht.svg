<svg class="fig" viewBox="0 0 760 340" role="img" xmlns="http://www.w3.org/2000/svg"><title>Ionosfeer overdag en 's nachts</title><desc>Overdag slokt de D-laag lage frequenties op en kaatst de F-laag hoge frequenties terug. 's Nachts is de D-laag weg en gaan hoge frequenties door de F-laag.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b accent2" text-anchor="middle">OVERDAG</text><line x1="20" y1="260" x2="360" y2="260" class="wire"/><rect x="20" y="60" width="340" height="36" class="sb"/><text x="25" y="52" class="lbl s" text-anchor="start">F-laag</text><rect x="20" y="170" width="340" height="22" class="cell"/><text x="355" y="186" class="lbl s" text-anchor="end">D-laag</text><path d="M50,258 L110,175" class="w-red" style="stroke-width:3"/><path d="M150,258 L230,64 L310,258" class="w-amber" style="stroke-width:3" marker-end="url(#pijl)"/><text x="50" y="282" class="lbl s red" text-anchor="start">lage freq.: opgeslokt</text><text x="270" y="300" class="lbl s" text-anchor="middle">hoge freq.: terug</text><text x="570" y="28" class="lbl b accent2" text-anchor="middle">'S NACHTS</text><line x1="400" y1="260" x2="740" y2="260" class="wire"/><rect x="400" y="60" width="340" height="24" class="sb"/><text x="405" y="52" class="lbl s" text-anchor="start">F-laag (dunner)</text><text x="735" y="186" class="lbl s" text-anchor="end">geen D-laag</text><path d="M420,258 L500,84 L580,258" class="w-amber" style="stroke-width:3" marker-end="url(#pijl)"/><path d="M620,258 L690,40" class="w-green" style="stroke-dasharray:6 5" marker-end="url(#pijl)"/><text x="500" y="282" class="lbl s" text-anchor="middle">lage freq.: komt ver</text><text x="660" y="282" class="lbl s green" text-anchor="middle">boven ±12 MHz:</text><text x="660" y="298" class="lbl s green" text-anchor="middle">gaat erdoor</text><text x="380" y="330" class="lbl b" text-anchor="middle">D-laag = slokt lage frequenties op. F-laag = kaatst terug.</text></svg>