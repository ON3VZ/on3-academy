<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Ongeval met elektriciteit</title><desc>Vier stappen: spanning uit, pas dan aanraken, 112 bellen, eerste hulp.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="20" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="47" r="20" class="sb"/><text x="55" y="53" class="lbl b" text-anchor="middle">1</text><text x="110" y="44" class="lbl b red" text-anchor="start">Spanning UIT</text><text x="110" y="64" class="lbl s" text-anchor="start">stekker uit of de centrale schakelaar / zekering uit</text><rect x="90" y="88" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="115" r="20" class="sb"/><text x="55" y="121" class="lbl b" text-anchor="middle">2</text><text x="110" y="112" class="lbl b " text-anchor="start">Pas dan aanraken</text><text x="110" y="132" class="lbl s" text-anchor="start">nooit eerder: anders word je zelf slachtoffer</text><rect x="90" y="156" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="183" r="20" class="sb"/><text x="55" y="189" class="lbl b" text-anchor="middle">3</text><text x="110" y="180" class="lbl b " text-anchor="start">Hulp bellen: 112</text><text x="110" y="200" class="lbl s" text-anchor="start">ook als het slachtoffer zich goed voelt</text><rect x="90" y="224" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="251" r="20" class="sb"/><text x="55" y="257" class="lbl b" text-anchor="middle">4</text><text x="110" y="248" class="lbl b " text-anchor="start">Eerste hulp</text><text x="110" y="268" class="lbl s" text-anchor="start">volgens wat je geleerd hebt, tot de hulpdiensten er zijn</text></svg>