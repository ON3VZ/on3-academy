<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Heengaand en gereflecteerd vermogen</title><desc>Het vermogen gaat van de zender naar de antenne. Als de antenne niet goed past, komt een deel terug naar de zender.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="90" width="130" height="60" rx="10" class="box"/><text x="85.0" y="125.0" class="lbl b" text-anchor="middle">zender</text><line x1="150" y1="120" x2="560" y2="120" class="feed"/><line x1="560" y1="120" x2="560" y2="60" class="feed"/><line x1="560" y1="60" x2="560" y2="20" class="ant"/><line x1="560" y1="34" x2="544" y2="14" class="ant"/><line x1="560" y1="34" x2="576" y2="14" class="ant"/><path d="M584.6,17.2 A16,16 0 0 1 584.6,42.8" class="w-amber"/><path d="M593.0,6.0 A30,30 0 0 1 593.0,54.0" class="w-amber"/><path d="M601.4,-5.2 A44,44 0 0 1 601.4,65.2" class="w-amber"/><line x1="180" y1="90" x2="520" y2="90" class="dim" style="stroke-width:4" marker-end="url(#pijl)"/><text x="330" y="76" class="lbl b accent2" text-anchor="middle">heengaand vermogen (naar de antenne)</text><line x1="520" y1="155" x2="300" y2="155" class="limit" style="stroke-width:3;stroke-dasharray:none" marker-end="url(#pijl)"/><text x="410" y="182" class="lbl b red" text-anchor="middle">gereflecteerd vermogen (terug naar de zender)</text><text x="350" y="138" class="lbl s" text-anchor="middle">transmissielijn (coax)</text><text x="380" y="216" class="lbl" text-anchor="middle">Hoe meer er terugkomt, hoe hoger de SWR.</text></svg>