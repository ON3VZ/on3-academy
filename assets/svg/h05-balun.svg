<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Balun</title><desc>Een coaxkabel gaat via een balun naar het midden van een dipool.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="120" width="110" height="56" rx="10" class="box"/><text x="75.0" y="153.0" class="lbl b" text-anchor="middle">zender</text><line x1="130" y1="148" x2="330" y2="148" class="feed"/><text x="230" y="136" class="lbl s" text-anchor="middle">coax (asymmetrisch)</text><rect x="330" y="120" width="100" height="56" rx="10" class="box"/><text x="380.0" y="153.0" class="lbl b" text-anchor="middle">balun</text><line x1="380" y1="120" x2="380" y2="70" class="wire"/><line x1="372" y1="120" x2="372" y2="70" class="wire"/><line x1="80" y1="60" x2="372" y2="60" class="ant"/><line x1="380" y1="60" x2="680" y2="60" class="ant"/><line x1="372" y1="70" x2="372" y2="60" class="wire"/><line x1="380" y1="70" x2="380" y2="60" class="wire"/><text x="380" y="38" class="lbl b" text-anchor="middle">dipool (symmetrisch)</text><text x="460" y="150" class="lbl b accent2" text-anchor="start">balun = balanced → unbalanced</text><text x="460" y="172" class="lbl s" text-anchor="start">voorkomt dat de buitenkant</text><text x="460" y="190" class="lbl s" text-anchor="start">van de coax meestraalt</text></svg>