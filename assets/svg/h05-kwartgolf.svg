<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Kwartgolfantenne</title><desc>Een verticale staaf van een kwart golflengte op een grondvlak. Het grondvlak vormt het spiegelbeeld, samen een halve golflengte.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="60" y="190" width="340" height="12" class="cell"/><text x="230" y="224" class="lbl s" text-anchor="middle">grondvlak (metalen plaat of draden in de grond)</text><line x1="230" y1="186" x2="230" y2="40" class="ant"/><line x1="230" y1="300" x2="230" y2="234" class="ghost"/><line x1="190" y1="40" x2="190" y2="186" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="180" y="118.0" class="lbl accent2 b" text-anchor="end">λ/4</text><text x="244" y="60" class="lbl b" text-anchor="start">straler</text><text x="244" y="290" class="lbl s" text-anchor="start">spiegelbeeld</text><text x="244" y="306" class="lbl s" text-anchor="start">(bestaat niet echt)</text><circle cx="230" cy="186" r="5" class="symfill"/><text x="242" y="178" class="lbl s" text-anchor="start">voedingspunt (coax)</text><text x="470" y="70" class="lbl b" text-anchor="start">Het grondvlak werkt als een spiegel.</text><text x="470" y="96" class="lbl" text-anchor="start">Samen met zijn spiegelbeeld gedraagt</text><text x="470" y="118" class="lbl" text-anchor="start">een kwartgolf zich als een dipool</text><text x="470" y="140" class="lbl" text-anchor="start">van een halve golflengte.</text><text x="470" y="180" class="lbl b mono accent2" text-anchor="start">λ/4 + λ/4 (spiegel) = λ/2</text></svg>