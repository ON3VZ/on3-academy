<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Symmetrisch en asymmetrisch</title><desc>Links een dipool met twee gelijke helften, rechts een staaf met een grondvlak: twee verschillende delen.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b green" text-anchor="middle">symmetrisch</text><line x1="40" y1="120" x2="180" y2="120" class="ant"/><line x1="200" y1="120" x2="340" y2="120" class="ant"/><line x1="190" y1="60" x2="190" y2="180" class="guide"/><text x="110" y="108" class="lbl s" text-anchor="middle">helft 1</text><text x="270" y="108" class="lbl s" text-anchor="middle">helft 2</text><text x="190" y="210" class="lbl b" text-anchor="middle">dipool, yagi:</text><text x="190" y="230" class="lbl s" text-anchor="middle">links = spiegelbeeld van rechts</text><text x="570" y="28" class="lbl b red" text-anchor="middle">asymmetrisch</text><line x1="570" y1="50" x2="570" y2="140" class="ant"/><rect x="490" y="140" width="160" height="10" class="cell"/><text x="590" y="80" class="lbl s" text-anchor="start">straler</text><text x="660" y="150" class="lbl s" text-anchor="start">grondvlak</text><text x="570" y="210" class="lbl b" text-anchor="middle">kwartgolf, groundplane, 5/8 λ,</text><text x="570" y="230" class="lbl s" text-anchor="middle">langedraad: twee ongelijke delen</text><text x="380" y="280" class="lbl b accent2" text-anchor="middle">Coax is ook asymmetrisch: binnen een draad, buiten een buis.</text></svg>