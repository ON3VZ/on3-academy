<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Blokschema ontvanger</title><desc>Antenne, transmissielijn, afstemming en RF-versterking, demodulator, audioversterker, luidspreker.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="40" y1="125" x2="40" y2="79" class="ant"/><line x1="40" y1="95" x2="24" y2="71" class="ant"/><line x1="40" y1="95" x2="56" y2="71" class="ant"/><polyline points="40,125 40,150 120,150 120,125 130,125" class="feed"/><rect x="130" y="90" width="160" height="70" rx="10" class="box"/><text x="210.0" y="121.0" class="lbl b" text-anchor="middle">afstemming</text><text x="210.0" y="139.0" class="lbl b" text-anchor="middle">+ RF-versterking</text><line x1="290" y1="125" x2="340" y2="125" class="arrow" marker-end="url(#pijl)"/><rect x="340" y="90" width="150" height="70" rx="10" class="box"/><text x="415.0" y="130.0" class="lbl b" text-anchor="middle">demodulator</text><line x1="490" y1="125" x2="540" y2="125" class="arrow" marker-end="url(#pijl)"/><rect x="540" y="90" width="140" height="70" rx="10" class="box"/><text x="610.0" y="121.0" class="lbl b" text-anchor="middle">audio-</text><text x="610.0" y="139.0" class="lbl b" text-anchor="middle">versterker</text><line x1="680" y1="125" x2="700" y2="125" class="wire"/><rect x="700" y="114" width="11" height="22" class="sym"/><path d="M711,114 L728,101 L728,149 L711,136" class="sym"/><text x="62" y="68" class="lbl b" text-anchor="start">antenne</text><text x="80" y="182" class="lbl b" text-anchor="middle">transmissielijn</text><text x="715" y="78" class="lbl b" text-anchor="middle">luidspreker</text><text x="210" y="208" class="lbl s accent2" text-anchor="middle">1e trap</text><text x="415" y="208" class="lbl s accent2" text-anchor="middle">2e trap</text><text x="610" y="208" class="lbl s accent2" text-anchor="middle">3e trap</text><text x="210" y="226" class="lbl s" text-anchor="middle">ingangstrap</text><text x="415" y="226" class="lbl s" text-anchor="middle">midden</text><text x="610" y="226" class="lbl s" text-anchor="middle">uitgangstrap</text></svg>