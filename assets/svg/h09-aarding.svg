<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Veiligheidsaarding</title><desc>Links raakt iemand een defect toestel zonder aarding aan: de stroom gaat door de persoon. Rechts heeft het toestel een aarding: de stroom gaat via de aarding.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b red" text-anchor="middle">ZONDER aarding</text><line x1="20" y1="280" x2="360" y2="280" class="wire"/><rect x="60" y="110" width="130" height="90" rx="8" class="box"/><text x="125" y="150" class="lbl b" text-anchor="middle">toestel</text><text x="125" y="170" class="lbl s red" text-anchor="middle">met defect</text><path d="M170,118 l10,26 l-8,0 l12,30" class="w-red" style="stroke-width:3"/><line x1="60" y1="150" x2="30" y2="150" class="wire"/><text x="30" y="140" class="lbl s" text-anchor="start">230 V</text><circle cx="240" cy="190.0" r="11.0" class="sym"/><line x1="240" y1="201.0" x2="240" y2="245.0" class="sym"/><line x1="240" y1="245.0" x2="226.0" y2="280" class="sym"/><line x1="240" y1="245.0" x2="254.0" y2="280" class="sym"/><line x1="240" y1="218.0" x2="210.0" y2="230.0" class="sym"/><line x1="240" y1="218.0" x2="262.0" y2="234.0" class="sym"/><path d="M190,170 L216,178 L240,210 L246,275" class="w-red" style="stroke-width:3" marker-end="url(#pijl)"/><text x="260" y="150" class="lbl s red" text-anchor="start">stroom door</text><text x="260" y="166" class="lbl s red" text-anchor="start">de persoon</text><text x="240" y="304" class="lbl b red" text-anchor="middle">levensgevaarlijk</text><text x="570" y="28" class="lbl b green" text-anchor="middle">MET aarding</text><line x1="400" y1="280" x2="740" y2="280" class="wire"/><rect x="440" y="110" width="130" height="90" rx="8" class="box"/><text x="505" y="150" class="lbl b" text-anchor="middle">toestel</text><text x="505" y="170" class="lbl s red" text-anchor="middle">met defect</text><path d="M550,118 l10,26 l-8,0 l12,30" class="w-red" style="stroke-width:3"/><line x1="440" y1="150" x2="410" y2="150" class="wire"/><text x="410" y="140" class="lbl s" text-anchor="start">230 V</text><line x1="505" y1="200" x2="505" y2="262" class="wire thick"/><line x1="490.0" y1="264" x2="520.0" y2="264" class="wire"/><line x1="495.0" y1="270" x2="515.0" y2="270" class="wire"/><line x1="500.0" y1="276" x2="510.0" y2="276" class="wire"/><path d="M515,205 L515,255" class="w-green" style="stroke-width:3" marker-end="url(#pijl)"/><text x="505" y="304" class="lbl s green" text-anchor="middle">stroom via de aarding</text><circle cx="670" cy="190.0" r="11.0" class="sym"/><line x1="670" y1="201.0" x2="670" y2="245.0" class="sym"/><line x1="670" y1="245.0" x2="656.0" y2="280" class="sym"/><line x1="670" y1="245.0" x2="684.0" y2="280" class="sym"/><line x1="670" y1="218.0" x2="640.0" y2="230.0" class="sym"/><line x1="670" y1="218.0" x2="692.0" y2="234.0" class="sym"/><text x="670" y="304" class="lbl b green" text-anchor="middle">veilig</text></svg>