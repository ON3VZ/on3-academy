<svg class="fig" viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title>Eindgevoede draadantenne</title><desc>Een lange draad tussen twee masten, aan één uiteinde verbonden met de zender, met de aarde als tegengewicht.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="200" y1="60" x2="200" y2="240" class="wire thick"/><line x1="620" y1="60" x2="620" y2="240" class="wire thick"/><line x1="200" y1="60" x2="620" y2="60" class="ant"/><path d="M200,60 Q175,130 160,190" class="ant"/><rect x="40" y="170" width="100" height="46" rx="10" class="box"/><text x="90.0" y="198.0" class="lbl b" text-anchor="middle">zender</text><line x1="140" y1="193" x2="160" y2="193" class="wire"/><line x1="90" y1="216" x2="90" y2="236" class="wire"/><line x1="75.0" y1="236" x2="105.0" y2="236" class="wire"/><line x1="80.0" y1="242" x2="100.0" y2="242" class="wire"/><line x1="85.0" y1="248" x2="95.0" y2="248" class="wire"/><text x="110" y="262" class="lbl s" text-anchor="start">aarding (tegengewicht)</text><text x="410" y="48" class="lbl b" text-anchor="middle">lange draad</text><text x="212" y="236" class="lbl s b" text-anchor="start">mast</text><text x="608" y="236" class="lbl s b" text-anchor="end">mast</text><text x="410" y="120" class="lbl" text-anchor="middle">Eén kant gevoed, de aarde dient als</text><text x="410" y="142" class="lbl" text-anchor="middle">tweede helft. De lengte én de hoogte</text><text x="410" y="164" class="lbl" text-anchor="middle">boven de grond bepalen de frequentie.</text></svg>