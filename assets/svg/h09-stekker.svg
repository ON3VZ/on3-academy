<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Netstekker aansluiten</title><desc>Bruin is de fase, blauw is de nul, geel-groen is de aarding.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="440" y="80" width="200" height="150" rx="40" class="cell" style="stroke:var(--text);stroke-width:2"/><text x="540" y="262" class="lbl s" text-anchor="middle">stekker (achterkant open)</text><circle cx="490" cy="160" r="12" class="sym"/><text x="490" y="196" class="lbl s" text-anchor="middle">fase</text><circle cx="590" cy="160" r="12" class="sym"/><text x="590" y="196" class="lbl s" text-anchor="middle">nul</text><rect x="525" y="96" width="30" height="20" rx="4" class="sym"/><text x="562" y="112" class="lbl s" text-anchor="start">aarding</text><path d="M30,50 H590 V148" style="fill:none;stroke:#2B6CB0;stroke-width:7"/><text x="30" y="38" class="lbl b" text-anchor="start">blauw</text><text x="130" y="38" class="lbl s" text-anchor="start">nul (netspanning)</text><path d="M30,100 H490 V148" style="fill:none;stroke:#8B5A2B;stroke-width:7"/><text x="30" y="88" class="lbl b" text-anchor="start">bruin</text><text x="130" y="88" class="lbl s" text-anchor="start">fase (netspanning)</text><path d="M30,250 H420 V230 Q420,200 540,200 V116" style="fill:none;stroke:#9ACD32;stroke-width:7"/><path d="M30,250 H420 V230 Q420,200 540,200 V116" style="fill:none;stroke:#E6C619;stroke-width:7;stroke-dasharray:10 10"/><text x="30" y="238" class="lbl b" text-anchor="start">geel-groen</text><text x="130" y="238" class="lbl s" text-anchor="start">aarding (veiligheid)</text></svg>