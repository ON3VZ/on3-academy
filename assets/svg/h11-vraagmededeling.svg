<svg class="fig" viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Vraag of mededeling</title><desc>Links QRM met vraagteken: heb je last van storing? Rechts QRM zonder vraagteken: ik heb last van storing.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="20" width="340" height="210" rx="12" class="box"/><text x="190" y="62" class="lbl s b" text-anchor="middle">VRAAG (met vraagteken)</text><rect x="110" y="80" width="160" height="62" rx="10" class="sb"/><text x="190" y="123" class="lbl big mono accent2" text-anchor="middle">QRM ?</text><text x="190" y="180" class="lbl s" text-anchor="middle">betekent:</text><text x="190" y="204" class="lbl b" text-anchor="middle">Heb je last van storing?</text><rect x="400" y="20" width="340" height="210" rx="12" class="box"/><text x="570" y="62" class="lbl s b" text-anchor="middle">MEDEDELING (zonder vraagteken)</text><rect x="490" y="80" width="160" height="62" rx="10" class="sb"/><text x="570" y="123" class="lbl big mono green" text-anchor="middle">QRM</text><text x="570" y="180" class="lbl s" text-anchor="middle">betekent:</text><text x="570" y="204" class="lbl b" text-anchor="middle">Ik heb last van storing.</text></svg>