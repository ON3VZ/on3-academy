<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Groundplane-antenne</title><desc>Verticale straler van een kwart golflengte met vier radialen die 45 graden onder de horizontale naar beneden hangen.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="230" y1="140" x2="230" y2="300" class="feed"/><line x1="230" y1="30" x2="230" y2="140" class="ant"/><line x1="230" y1="140" x2="123.935" y2="246.065" class="ant"/><line x1="230" y1="140" x2="336.065" y2="246.065" class="ant"/><line x1="230" y1="140" x2="185.5" y2="258.8" class="ant" style="opacity:.5"/><line x1="230" y1="140" x2="274.5" y2="216.4" class="ant" style="opacity:.5"/><circle cx="230" cy="140" r="4" class="symfill"/><line x1="230" y1="140" x2="356.065" y2="140" class="guide2"/><path d="M276,140 A46,46 0 0 1 262.5,172.5" class="w-amber" style="fill:none"/><text x="244" y="60" class="lbl b" text-anchor="start">straler (λ/4)</text><text x="290" y="166" class="lbl s b accent2" text-anchor="start">45°</text><text x="270" y="292" class="lbl b" text-anchor="start">radialen (elk λ/4)</text><text x="220" y="315" class="lbl s" text-anchor="end">coax naar zender</text><text x="470" y="70" class="lbl b" text-anchor="start">Een kwartgolf hoog op een mast.</text><text x="470" y="96" class="lbl" text-anchor="start">De grond is te ver weg, dus maken</text><text x="470" y="118" class="lbl" text-anchor="start">schuine draden (radialen) het</text><text x="470" y="140" class="lbl" text-anchor="start">grondvlak.</text><text x="470" y="176" class="lbl s" text-anchor="start">Radialen hangen ongeveer 45° onder</text><text x="470" y="194" class="lbl s" text-anchor="start">de horizontale. Meestal 3 of 4 stuks.</text><text x="470" y="222" class="lbl s" text-anchor="start">Kern van de coax aan de straler,</text><text x="470" y="240" class="lbl s" text-anchor="start">mantel aan de radialen.</text><text x="470" y="268" class="lbl s" text-anchor="start">Rondstraler, verticaal gepolariseerd.</text></svg>