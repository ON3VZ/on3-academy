<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Groundplane-antenne</title><desc>Verticale straler van een kwart golflengte met schuin naar beneden hangende radialen, ongeveer 45 graden.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="230" y1="30" x2="230" y2="170" class="ant"/><line x1="230" y1="170" x2="120" y2="269.0" class="ant"/><line x1="230" y1="170" x2="340" y2="269.0" class="ant"/><line x1="230" y1="170" x2="180.5" y2="285.5" class="ant"/><line x1="230" y1="170" x2="279.5" y2="285.5" class="ant"/><text x="244" y="60" class="lbl b" text-anchor="start">straler (λ/4)</text><text x="345" y="290" class="lbl b" text-anchor="start">radialen (elk λ/4)</text><line x1="230" y1="170" x2="230" y2="300" class="feed"/><text x="220" y="315" class="lbl s" text-anchor="end">coax naar zender</text><path d="M270,206 A50,50 0 0 0 282,170" class="w-amber"/><text x="300" y="200" class="lbl s b accent2" text-anchor="start">± 45°</text><text x="450" y="70" class="lbl b" text-anchor="start">Een kwartgolf hoog op een mast.</text><text x="450" y="96" class="lbl" text-anchor="start">De grond is te ver weg, dus maken</text><text x="450" y="118" class="lbl" text-anchor="start">schuine draden (radialen) het</text><text x="450" y="140" class="lbl" text-anchor="start">grondvlak.</text><text x="450" y="176" class="lbl s" text-anchor="start">Rondstraler, verticaal gepolariseerd.</text></svg>