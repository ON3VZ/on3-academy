<svg class="fig" viewBox="0 0 760 380" role="img" xmlns="http://www.w3.org/2000/svg"><title>Rangorde van de regels</title><desc>Van boven naar onder: wet, koninklijk besluit, ministerieel besluit, besluit van de Raad van het BIPT. Een lagere regel mag niet in strijd zijn met een hogere.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="190.0" y="30" width="120" height="66" rx="8" class="sb"/><text x="250" y="72" class="lbl big mono" text-anchor="middle">WET</text><text x="475" y="58" class="lbl b" text-anchor="start">wet van 13 juni 2005</text><text x="475" y="80" class="lbl s" text-anchor="start">gemaakt door het parlement</text><rect x="140.0" y="112" width="220" height="66" rx="8" class="sb"/><text x="250" y="154" class="lbl big mono" text-anchor="middle">KB</text><text x="475" y="140" class="lbl b" text-anchor="start">KB van 18 december 2009</text><text x="475" y="162" class="lbl s" text-anchor="start">de Koning (de regering)</text><rect x="90.0" y="194" width="320" height="66" rx="8" class="box"/><text x="250" y="236" class="lbl big mono" text-anchor="middle">MB</text><text x="475" y="222" class="lbl b" text-anchor="start">ministerieel besluit</text><text x="475" y="244" class="lbl s" text-anchor="start">een minister</text><rect x="40.0" y="276" width="420" height="66" rx="8" class="box"/><text x="250" y="318" class="lbl big mono" text-anchor="middle">BIPT</text><text x="475" y="304" class="lbl b" text-anchor="start">besluit van de Raad van het BIPT</text><text x="475" y="326" class="lbl s" text-anchor="start">bv. frequentietabel, examenregeling</text><line x1="40" y1="350" x2="40" y2="40" class="dim" marker-end="url(#pijl)"/><text x="30" y="200" class="lbl s b" text-anchor="middle" transform="rotate(-90 30 200)">hoger</text><text x="380" y="372" class="lbl b accent2" text-anchor="middle">Een lagere regel mag nooit in strijd zijn met een hogere.</text></svg>