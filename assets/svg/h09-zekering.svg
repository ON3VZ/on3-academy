<svg class="fig" viewBox="0 0 760 200" role="img" xmlns="http://www.w3.org/2000/svg"><title>Zekering</title><desc>Voeding, dan een zekering, dan het toestel.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="70" width="120" height="60" rx="10" class="box"/><text x="80.0" y="96.0" class="lbl b" text-anchor="middle">voeding</text><text x="80.0" y="114.0" class="lbl b" text-anchor="middle">of batterij</text><line x1="140" y1="100" x2="260" y2="100" class="wire"/><line x1="260" y1="100" x2="340" y2="100" class="wire"/><rect x="278" y="91" width="44" height="18" class="sym"/><text x="300" y="70" class="lbl b" text-anchor="middle">zekering</text><line x1="340" y1="100" x2="480" y2="100" class="wire"/><rect x="480" y="70" width="140" height="60" rx="10" class="box"/><text x="550.0" y="105.0" class="lbl b" text-anchor="middle">toestel</text><text x="380" y="170" class="lbl" text-anchor="middle">De zekering zit in de toevoer, zo dicht mogelijk bij de bron.</text><text x="380" y="190" class="lbl s" text-anchor="middle">Bij een te grote stroom brandt of springt ze: de stroom stopt.</text></svg>