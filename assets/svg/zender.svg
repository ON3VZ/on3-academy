<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Blokschema zender</title><desc>Blokschema van een zender: frequentiegenerator naar modulator naar HF-eindversterker, dan via de voedingslijn naar de antenne. Onder de modulator de microfoonversterker met de microfoon.</desc><rect x="20" y="60" width="150" height="70" rx="10" class="box"/><text x="95.0" y="92" class="lbl b" text-anchor="middle">frequentie-</text><text x="95.0" y="112" class="lbl b" text-anchor="middle">generator</text><rect x="230" y="60" width="150" height="70" rx="10" class="box"/><text x="305.0" y="101" class="lbl b" text-anchor="middle">modulator</text><rect x="440" y="60" width="150" height="70" rx="10" class="box"/><text x="515.0" y="92" class="lbl b" text-anchor="middle">RF-vermogen-</text><text x="515.0" y="112" class="lbl b" text-anchor="middle">versterker</text><rect x="230" y="190" width="150" height="70" rx="10" class="box"/><text x="305.0" y="222" class="lbl b" text-anchor="middle">microfoon-</text><text x="305.0" y="242" class="lbl b" text-anchor="middle">versterker</text><line x1="170" y1="95" x2="230" y2="95" class="wire"/><line x1="380" y1="95" x2="440" y2="95" class="wire"/><line x1="305" y1="130" x2="305" y2="190" class="wire"/><polyline points="590,95 690,95 690,40" class="feed"/><path d="M690,40 L690,12 M690,40 L668,14 M690,40 L712,14" class="ant"/><line x1="200" y1="225" x2="230" y2="225" class="wire"/><circle cx="186" cy="225" r="14" class="mic"/><line x1="172" y1="208" x2="172" y2="242" class="micbar"/><text x="160" y="230" class="lbl b" text-anchor="end">microfoon</text><text x="700" y="128" class="lbl b" text-anchor="middle">transmissielijn</text><text x="660" y="24" class="lbl b" text-anchor="end">antenne</text><text x="95" y="160" class="lbl s accent" text-anchor="middle">draaggolf (RF)</text><text x="305" y="280" class="lbl s green" text-anchor="middle">audio</text></svg>