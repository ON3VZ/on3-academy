<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Radiogolven en gebouwen</title><desc>Een muur van beton houdt de golf grotendeels tegen, een glazen raam laat ze door.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="300" y="40" width="260" height="220" class="cell"/><rect x="296" y="40" width="12" height="220" class="symfill" opacity="0.7"/><rect x="296" y="110" width="12" height="60" class="sb"/><text x="318" y="62" class="lbl s b red" text-anchor="start">muur (beton)</text><text x="318" y="104" class="lbl s b green" text-anchor="start">raam (glas)</text><text x="318" y="250" class="lbl s b red" text-anchor="start">muur (beton)</text><line x1="40" y1="140" x2="500" y2="140" class="w-amber" marker-end="url(#pijl)"/><line x1="40" y1="75" x2="290" y2="75" class="w-red" marker-end="url(#pijl)"/><text x="160" y="65" class="lbl s" text-anchor="middle">botst op de muur</text><line x1="40" y1="210" x2="290" y2="210" class="w-red" marker-end="url(#pijl)"/><text x="160" y="200" class="lbl s" text-anchor="middle">botst op de muur</text><text x="160" y="130" class="lbl s" text-anchor="middle">gaat door het glas</text><text x="430" y="190" class="lbl s" text-anchor="middle">binnen: het best</text><text x="430" y="206" class="lbl s" text-anchor="middle">bij het raam</text><line x1="690" y1="260" x2="690" y2="140" class="wire thick"/><line x1="690" y1="140" x2="690" y2="124" class="ant"/><line x1="690" y1="132" x2="681" y2="120" class="ant"/><line x1="690" y1="132" x2="699" y2="120" class="ant"/><text x="690" y="284" class="lbl s" text-anchor="middle">buitenantenne: best</text></svg>