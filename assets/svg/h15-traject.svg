<svg class="fig" viewBox="0 0 760 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>Van kandidaat tot vergunninghouder</title><desc>Zes stappen: opleiding, praktische proef, theorie-examen, getuigschrift, bedieningscertificaat met roepnaam, stationsvergunning.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="12" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="43" r="20" class="sb"/><text x="50" y="49" class="lbl b" text-anchor="middle">1</text><text x="108" y="39" class="lbl b" text-anchor="start">Opleiding</text><text x="108" y="61" class="lbl s" text-anchor="start">bij een erkende vereniging, ook zonder lid te zijn</text><text x="738" y="39" class="lbl s mono accent2" text-anchor="end">art. 17/4</text><rect x="90" y="88" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="119" r="20" class="sb"/><text x="50" y="125" class="lbl b" text-anchor="middle">2</text><text x="108" y="115" class="lbl b" text-anchor="start">Praktische proef</text><text x="108" y="137" class="lbl s" text-anchor="start">bij de vereniging: attest, 1 jaar geldig</text><text x="738" y="115" class="lbl s mono accent2" text-anchor="end">examenreglement</text><rect x="90" y="164" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="195" r="20" class="sb"/><text x="50" y="201" class="lbl b" text-anchor="middle">3</text><text x="108" y="191" class="lbl b" text-anchor="start">Theorie-examen bij het BIPT</text><text x="108" y="213" class="lbl s" text-anchor="start">minstens 12 jaar, dossierrecht bij inschrijving</text><text x="738" y="191" class="lbl s mono accent2" text-anchor="end">art. 17/2, 35</text><rect x="90" y="240" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="271" r="20" class="sb"/><text x="50" y="277" class="lbl b" text-anchor="middle">4</text><text x="108" y="267" class="lbl b" text-anchor="start">Getuigschrift</text><text x="108" y="289" class="lbl s" text-anchor="start">van aspirant privaat radiotelefonist</text><text x="738" y="267" class="lbl s mono accent2" text-anchor="end">BIPT-document</text><rect x="90" y="316" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="347" r="20" class="sb"/><text x="50" y="353" class="lbl b" text-anchor="middle">5</text><text x="108" y="343" class="lbl b" text-anchor="start">Bedieningscertificaat + roepnaam</text><text x="108" y="365" class="lbl s" text-anchor="start">5 jaar geldig, verlengbaar</text><text x="738" y="343" class="lbl s mono accent2" text-anchor="end">art. 6/1, 17/1</text><rect x="90" y="392" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="423" r="20" class="sb"/><text x="50" y="429" class="lbl b" text-anchor="middle">6</text><text x="108" y="419" class="lbl b" text-anchor="start">Stationsvergunning (5e categorie)</text><text x="108" y="441" class="lbl s" text-anchor="start">eerst certificaat, jaarlijks recht</text><text x="738" y="419" class="lbl s mono accent2" text-anchor="end">art. 17/5, 37</text></svg>