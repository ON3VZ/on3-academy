<svg class="fig" viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Waar zet je een filter</title><desc>Boven fout: filter bij het stopcontact. Onder goed: filter vlak bij het gestoorde toestel.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="40" class="lbl b red" text-anchor="start">FOUT</text><rect x="20" y="50" width="60" height="40" rx="6" class="cell"/><text x="50" y="75" class="lbl s" text-anchor="middle">230 V</text><rect x="600" y="40" width="140" height="60" rx="10" class="box"/><text x="670.0" y="66.0" class="lbl b" text-anchor="middle">gestoord</text><text x="670.0" y="84.0" class="lbl b" text-anchor="middle">toestel</text><line x1="80" y1="70" x2="600" y2="70" class="wire thick"/><rect x="110" y="54" width="56" height="32" rx="5" class="box"/><text x="138" y="75" class="lbl s b" text-anchor="middle">filter</text><path d="M260,30 q20,-12 40,0 t40,0 t40,0" class="w-red"/><text x="370" y="100" class="lbl s red" text-anchor="middle">het snoer na de filter pikt opnieuw signaal op</text><text x="20" y="150" class="lbl b green" text-anchor="start">GOED</text><rect x="20" y="160" width="60" height="40" rx="6" class="cell"/><text x="50" y="185" class="lbl s" text-anchor="middle">230 V</text><rect x="600" y="150" width="140" height="60" rx="10" class="box"/><text x="670.0" y="176.0" class="lbl b" text-anchor="middle">gestoord</text><text x="670.0" y="194.0" class="lbl b" text-anchor="middle">toestel</text><line x1="80" y1="180" x2="600" y2="180" class="wire thick"/><rect x="520" y="164" width="56" height="32" rx="5" class="box"/><text x="548" y="185" class="lbl s b" text-anchor="middle">filter</text><text x="330" y="210" class="lbl s green" text-anchor="middle">filter zo dicht mogelijk bij het toestel</text><text x="50" y="370" class="lbl s" text-anchor="middle">stopcontact</text></svg>