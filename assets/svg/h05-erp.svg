<svg class="fig" viewBox="0 0 760 270" role="img" xmlns="http://www.w3.org/2000/svg"><title>ERP</title><desc>Boven: 10 watt in een yagi met winst 5 geeft een ERP van 50 watt. Onder: dat is even sterk als 50 watt in een gewone dipool.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="50" width="120" height="56" rx="10" class="box"/><text x="80.0" y="74.0" class="lbl b" text-anchor="middle">zender</text><text x="80.0" y="92.0" class="lbl b" text-anchor="middle">10 W</text><line x1="140" y1="78" x2="230" y2="78" class="feed"/><line x1="258.0" y1="99.0" x2="342.0" y2="57.0" class="wire"/><line x1="208.5" y1="79.2" x2="307.5" y2="118.8" class="ant"/><line x1="241.0" y1="67.0" x2="331.0" y2="103.0" class="ant"/><line x1="273.5" y1="54.8" x2="354.5" y2="87.2" class="ant"/><line x1="303.75" y1="41.7" x2="380.25" y2="72.3" class="ant"/><text x="300" y="140" class="lbl b" text-anchor="middle">yagi, winst 5</text><line x1="380" y1="78" x2="480" y2="78" class="dim" marker-end="url(#pijl)"/><text x="560" y="70" class="lbl b mono" text-anchor="middle">ERP = 10 W × 5</text><text x="560" y="96" class="lbl big" text-anchor="middle">= 50 W</text><line x1="20" y1="170" x2="740" y2="170" class="guide2"/><rect x="20" y="190" width="120" height="56" rx="10" class="box"/><text x="80.0" y="214.0" class="lbl b" text-anchor="middle">zender</text><text x="80.0" y="232.0" class="lbl b" text-anchor="middle">50 W</text><line x1="140" y1="218" x2="260" y2="218" class="feed"/><line x1="200" y1="200" x2="256" y2="200" class="ant"/><line x1="264" y1="200" x2="320" y2="200" class="ant"/><line x1="260" y1="218" x2="260" y2="200" class="feed"/><text x="260" y="250" class="lbl b" text-anchor="middle">gewone dipool</text><text x="380" y="222" class="lbl s" text-anchor="start">= in de voorkeurrichting even sterk als boven</text></svg>