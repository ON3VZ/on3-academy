<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Symétrique et asymétrique</title><desc>À gauche, un dipôle à deux moitiés identiques. À droite, un brin avec un plan de sol : deux parties différentes.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b green" text-anchor="middle">symétrique</text><line x1="40" y1="120" x2="180" y2="120" class="ant"/><line x1="200" y1="120" x2="340" y2="120" class="ant"/><line x1="190" y1="60" x2="190" y2="180" class="guide"/><text x="110" y="108" class="lbl s" text-anchor="middle">moitié 1</text><text x="270" y="108" class="lbl s" text-anchor="middle">moitié 2</text><text x="190" y="210" class="lbl b" text-anchor="middle">dipôle, yagi :</text><text x="190" y="230" class="lbl s" text-anchor="middle">gauche = image miroir de droite</text><text x="570" y="28" class="lbl b red" text-anchor="middle">asymétrique</text><line x1="570" y1="50" x2="570" y2="140" class="ant"/><rect x="490" y="140" width="160" height="10" class="cell"/><text x="590" y="80" class="lbl s" text-anchor="start">élément rayonnant</text><text x="660" y="150" class="lbl s" text-anchor="start">plan de sol</text><text x="570" y="210" class="lbl b" text-anchor="middle">quart d'onde, ground plane, 5/8 λ,</text><text x="570" y="230" class="lbl s" text-anchor="middle">long fil : deux parties inégales</text><text x="380" y="280" class="lbl b accent2" text-anchor="middle">Le coaxial est aussi asymétrique : un fil dedans, un tube autour.</text></svg>