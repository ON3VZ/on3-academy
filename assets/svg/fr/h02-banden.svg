<svg class="fig" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg"><title>Tableau des fréquences classe C</title><desc>Neuf lignes : huit bandes de 80 m à 70 cm, avec statut et puissance maximale. HF 25 W, VHF et UHF 50 W.</desc><text x="20" y="28" class="lbl b" text-anchor="start">Classe C : où pouvez-vous émettre ?</text><text x="560" y="28" class="lbl s b" text-anchor="middle">statut</text><text x="690" y="28" class="lbl s b" text-anchor="middle">max</text><rect x="20" y="50" width="720" height="32" rx="6" class="cell"/><text x="36" y="72" class="lbl b mono" text-anchor="start">80 m</text><text x="130" y="72" class="lbl" text-anchor="start">3,500 à 3,800 MHz</text><rect x="520" y="55" width="80" height="22" rx="11" style="fill:var(--cyan);opacity:.85"/><text x="560" y="71" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:13px;font-family:var(--f-mono)">P</text><text x="690" y="72" class="lbl b" text-anchor="middle">25 W</text><rect x="20" y="90" width="720" height="32" rx="6" class="cell"/><text x="36" y="112" class="lbl b mono" text-anchor="start">40 m</text><text x="130" y="112" class="lbl" text-anchor="start">7,000 à 7,100 MHz</text><rect x="520" y="95" width="80" height="22" rx="11" style="fill:var(--primary);opacity:.85"/><text x="560" y="111" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:13px;font-family:var(--f-mono)">PEX</text><text x="690" y="112" class="lbl b" text-anchor="middle">25 W</text><rect x="20" y="130" width="720" height="32" rx="6" class="cell"/><text x="36" y="152" class="lbl b mono" text-anchor="start">40 m</text><text x="130" y="152" class="lbl" text-anchor="start">7,100 à 7,200 MHz</text><rect x="520" y="135" width="80" height="22" rx="11" style="fill:var(--amber);opacity:.85"/><text x="560" y="151" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:13px;font-family:var(--f-mono)">S</text><text x="690" y="152" class="lbl b" text-anchor="middle">25 W</text><rect x="20" y="170"