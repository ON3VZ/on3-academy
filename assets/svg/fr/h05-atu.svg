<svg class="fig" viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Boîte d'accord</title><desc>Émetteur, ROS-mètre, boîte d'accord, coaxial et antenne. Entre l'émetteur et la boîte d'accord, le ROS devient 1 : 1, entre la boîte d'accord et l'antenne, rien ne change.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="10" y="120" width="110" height="56" rx="10" class="box"/><text x="65.0" y="153.0" class="lbl b" text-anchor="middle">émetteur</text><line x1="120" y1="148" x2="160" y2="148" class="feed"/><rect x="160" y="120" width="110" height="56" rx="10" class="box"/><text x="215.0" y="144.0" class="lbl b" text-anchor="middle">ROS-</text><text x="215.0" y="162.0" class="lbl b" text-anchor="middle">mètre</text><line x1="270" y1="148" x2="310" y2="148" class="feed"/><rect x="310" y="120" width="100" height="56" rx="10" class="box"/><text x="360.0" y="144.0" class="lbl b" text-anchor="middle">boîte</text><text x="360.0" y="162.0" class="lbl b" text-anchor="middle">d'accord</text><line x1="410" y1="148" x2="640" y2="148" class="feed"/><line x1="640" y1="148" x2="640" y2="90" class="feed"/><line x1="640" y1="90" x2="640" y2="40" class="ant"/><line x1="640" y1="56" x2="622" y2="34" class="ant"/><line x1="640" y1="56" x2="658" y2="34" class="ant"/><line x1="10" y1="100" x2="410" y2="100" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="210.0" y="92" class="lbl accent2 b" text-anchor="middle">ROS ici 1 : 1 (émetteur satisfait)</text><line x1="412" y1="200" x2="640" y2="200" class="limit" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="526" y="226" class="lbl b red" text-anchor="middle">ROS ici inchangé</text><text x="526" y="136" class="lbl s" text-anchor="middle">coaxial</text></svg>