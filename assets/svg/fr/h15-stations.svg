<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Quatre types de stations de radiocommunications</title><desc>Fixe : installée à demeure en un lieu déterminé. Transportable : peut être déplacée mais n'est utilisée qu'à l'arrêt. Mobile : installée dans un véhicule, en roulant ou à l'arrêt. Portable : indépendante d'un véhicule, en mouvement ou à l'arrêt.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="30" class="lbl s b" text-anchor="start">type de station</text><text x="220" y="30" class="lbl s b" text-anchor="start">qu'est-ce que c'est ?</text><text x="420" y="30" class="lbl s b" text-anchor="start">déplaçable ?</text><text x="560" y="30" class="lbl s b" text-anchor="start">utilisation</text><rect x="10" y="46" width="740" height="54" rx="8" class="box"/><text x="24" y="79" class="lbl b mono accent2" text-anchor="start">fixe</text><text x="220" y="70" class="lbl" text-anchor="start">installée à demeure</text><text x="220" y="90" class="lbl" text-anchor="start">en un lieu déterminé</text><text x="450" y="79" class="lbl b" text-anchor="middle">non</text><text x="560" y="79" class="lbl b" text-anchor="start">à cet endroit</text><rect x="10" y="108" width="740" height="54" rx="8" class="cell"/><text x="24" y="141" class="lbl b mono accent2" text-anchor="start">transportable</text><text x="220" y="132" class="lbl" text-anchor="start">peut être</text><text x="220" y="152" class="lbl" text-anchor="start">déplacée</text><text x="450" y="141" class="lbl b" text-anchor="middle">oui</text><text x="560" y="141" class="lbl b" text-anchor="start">uniquement à l'arrêt</text><rect x="10" y="170" width="740" height="54" rx="8" class="box"/><text x="24" y="203" class="lbl b mono accent2" text-anchor="start">mobile</text><text x="220" y="194" class="lbl" text-anchor="start">installée dans</text><text x="220" y="214" class="lbl" text-anchor="start">un véhicule</text><text x="450" y="203" class="lbl b" text-anchor="middle">oui</text><text x="560" y="203" class="lbl b" text-anchor="start">en roulant ou à l'arrêt</text><rect x="10" y="232" width="740" height="54" rx="8" class="cell"/><text x="24" y="265" class="lbl b mono accent2" text-anchor="start">portable</text><text x="220" y="256" class="lbl" text-anchor="start">indépendante</text><text x="220" y="276" class="lbl" text-anchor="start">d'un véhicule</text><text x="450" y="265" class="lbl b" text-anchor="middle">oui</text><text x="560" y="265" class="lbl b" text-anchor="start">en marchant ou à l'arrêt</text></svg>