<svg class="fig" viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Demander trop tard coûte plus cher</title><desc>Ligne du temps : 20 jours ouvrables ou plus avant la date, droit de dossier normal ; moins de 20 jours ouvrables, le double ; moins de 5 jours ouvrables, le quintuple. Pour les autorisations temporaires, 5 et 2 jours ouvrables.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="28" class="lbl b" text-anchor="start">Demande introduite ... jours ouvrables avant la date souhaitée</text><line x1="40" y1="120" x2="720" y2="120" class="wire thick"/><rect x="40" y="70" width="320" height="50" class="box"/><text x="200.0" y="102" class="lbl big mono" text-anchor="middle">× 1</text><text x="200.0" y="148" class="lbl b" text-anchor="middle">20 ou plus</text><text x="200.0" y="168" class="lbl s" text-anchor="middle">droit de dossier normal</text><rect x="360" y="70" width="240" height="50" class="cell"/><text x="480.0" y="102" class="lbl big mono" text-anchor="middle">× 2</text><text x="480.0" y="148" class="lbl b" text-anchor="middle">moins de 20</text><text x="480.0" y="168" class="lbl s" text-anchor="middle">doublé</text><rect x="600" y="70" width="120" height="50" class="sb"/><text x="660.0" y="102" class="lbl big mono" text-anchor="middle">× 5</text><text x="660.0" y="148" class="lbl b" text-anchor="middle">moins de 5</text><text x="660.0" y="168" class="lbl s" text-anchor="middle">quintuplé</text><text x="720" y="60" class="lbl s b" text-anchor="end">date souhaitée</text><text x="380" y="210" class="lbl accent2 b" text-anchor="middle">Autorisation temporaire : limites de 5 et 2 jours ouvrables au lieu de 20 et 5.</text><text x="380" y="236" class="lbl s" text-anchor="middle">Modification d&#39;une autorisation : la moitié du droit de dossier. (AR art. 35)</text></svg>