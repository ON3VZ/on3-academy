<svg class="fig" viewBox="0 0 760 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>De candidat à titulaire d'une autorisation</title><desc>Six étapes : formation, épreuve pratique, examen théorique, attestation de réussite, certificat d'opérateur avec indicatif d'appel, autorisation de station.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="12" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="43" r="20" class="sb"/><text x="50" y="49" class="lbl b" text-anchor="middle">1</text><text x="108" y="39" class="lbl b" text-anchor="start">Formation</text><text x="108" y="61" class="lbl s" text-anchor="start">auprès d'une association reconnue, même sans affiliation</text><text x="738" y="39" class="lbl s mono accent2" text-anchor="end">art. 17/4</text><rect x="90" y="88" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="119" r="20" class="sb"/><text x="50" y="125" class="lbl b" text-anchor="middle">2</text><text x="108" y="115" class="lbl b" text-anchor="start">Épreuve pratique</text><text x="108" y="137" class="lbl s" text-anchor="start">à l'association : attestation valable 1 an</text><text x="738" y="115" class="lbl s mono accent2" text-anchor="end">règlement d'examen</text><rect x="90" y="164" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="195" r="20" class="sb"/><text x="50" y="201" class="lbl b" text-anchor="middle">3</text><text x="108" y="191" class="lbl b" text-anchor="start">Examen théorique à l'IBPT</text><text x="108" y="213" class="lbl s" text-anchor="start">12 ans minimum, droit de dossier à l'inscription</text><text x="738" y="191" class="lbl s mono accent2" text-anchor="end">art. 17/2, 35</text><rect x="90" y="240" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="271" r="20" class="sb"/><text x="50" y="277" class="lbl b" text-anchor="middle">4</text><text x="108" y="278" class="lbl b" text-anchor="start">Attestation de réussite</text><text x="738" y="267" class="lbl s mono accent2" text-anchor="end">document IBPT</text><rect x="90" y="316" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="347" r="20" class="sb"/><text x="50" y="353" class="lbl b" text-anchor="middle">5</text><text x="108" y="343" class="lbl b" text-anchor="start">Certificat d'opérateur + indicatif d'appel</text><text x="108" y="365" class="lbl s" text-anchor="start">valable 5 ans, renouvelable</text><text x="738" y="343" class="lbl s mono accent2" text-anchor="end">art. 6/1, 17/1</text><rect x="90" y="392" width="660" height="62" rx="10" class="box"/><circle cx="50" cy="423" r="20" class="sb"/><text x="50" y="429" class="lbl b" text-anchor="middle">6</text><text x="108" y="419" class="lbl b" text-anchor="start">Autorisation de station (5e catégorie)</text><text x="108" y="441" class="lbl s" text-anchor="start">d'abord le certificat, redevance annuelle</text><text x="738" y="419" class="lbl s mono accent2" text-anchor="end">art. 17/5, 37</text></svg>