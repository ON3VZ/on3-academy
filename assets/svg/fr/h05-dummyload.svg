<svg class="fig" viewBox="0 0 760 270" role="img" xmlns="http://www.w3.org/2000/svg"><title>Charge fictive</title><desc>En haut : émetteur raccordé à une antenne, des ondes radio partent. En bas : émetteur raccordé à une charge fictive, la puissance devient de la chaleur.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="30" width="110" height="56" rx="10" class="box"/><text x="75.0" y="63.0" class="lbl b" text-anchor="middle">émetteur</text><line x1="130" y1="58" x2="260" y2="58" class="feed"/><line x1="260" y1="58" x2="260" y2="20" class="ant"/><line x1="260" y1="34" x2="244" y2="14" class="ant"/><line x1="260" y1="34" x2="276" y2="14" class="ant"/><path d="M281.6,17.2 A16,16 0 0 1 281.6,42.8" class="w-amber"/><path d="M290.0,6.0 A30,30 0 0 1 290.0,54.0" class="w-amber"/><path d="M298.4,-5.2 A44,44 0 0 1 298.4,65.2" class="w-amber"/><path d="M306.8,-16.4 A58,58 0 0 1 306.8,76.4" class="w-amber"/><text x="400" y="64" class="lbl" text-anchor="start">antenne : la puissance est rayonnée</text><line x1="20" y1="125" x2="740" y2="125" class="guide2"/><rect x="20" y="160" width="110" height="56" rx="10" class="box"/><text x="75.0" y="193.0" class="lbl b" text-anchor="middle">émetteur</text><line x1="130" y1="188" x2="260" y2="188" class="feed"/><rect x="260" y="150" width="120" height="76" rx="10" class="cell"/><rect x="290" y="179" width="60" height="18" class="sym"/><line x1="260" y1="188" x2="290" y2="188" class="wire"/><line x1="350" y1="188" x2="365" y2="188" class="wire"/><text x="320" y="244" class="lbl s" text-anchor="middle">résistance blindée</text><path d="M300,146 q-6,-10 0,-20 q6,-10 0,-20" class="w-red"/><path d="M320,146 q-6,-10 0,-20 q6,-10 0,-20" class="w-red"/><path d="M340,146 q-6,-10 0,-20 q6,-10 0,-20" class="w-red"/><text x="400" y="182" class="lbl" text-anchor="start">charge fictive : la puissance devient chaleur,</text><text x="400" y="204" class="lbl b" text-anchor="start">rien ne part dans l'air</text></svg>