<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Schéma fonctionnel d'un émetteur</title><desc>Schéma fonctionnel d'un émetteur : générateur de fréquence vers modulateur vers amplificateur final HF, puis par la ligne d'alimentation vers l'antenne. Sous le modulateur, l'amplificateur de microphone avec le microphone.</desc><rect x="20" y="60" width="150" height="70" rx="10" class="box"/><text x="95.0" y="105" class="lbl big" text-anchor="middle">A</text><rect x="230" y="60" width="150" height="70" rx="10" class="box"/><text x="305.0" y="105" class="lbl big" text-anchor="middle">B</text><rect x="440" y="60" width="150" height="70" rx="10" class="box"/><text x="515.0" y="105" class="lbl big" text-anchor="middle">C</text><rect x="230" y="190" width="150" height="70" rx="10" class="box"/><text x="305.0" y="235" class="lbl big" text-anchor="middle">D</text><line x1="170" y1="95" x2="230" y2="95" class="wire"/><line x1="380" y1="95" x2="440" y2="95" class="wire"/><line x1="305" y1="130" x2="305" y2="190" class="wire"/><polyline points="590,95 690,95 690,40" class="feed"/><path d="M690,40 L690,12 M690,40 L668,14 M690,40 L712,14" class="ant"/><line x1="200" y1="225" x2="230" y2="225" class="wire"/><circle cx="186" cy="225" r="14" class="mic"/><line x1="172" y1="208" x2="172" y2="242" class="micbar"/><text x="150" y="230" class="lbl big" text-anchor="end">E</text><text x="640" y="125" class="lbl big" text-anchor="middle">F</text><text x="724" y="30" class="lbl big" text-anchor="start">G</text></svg>