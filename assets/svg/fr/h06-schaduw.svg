<svg class="fig" viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title>Zone d'ombre derrière une colline</title><desc>Un émetteur à gauche, une colline au milieu. Derrière la colline se trouve une zone d'ombre avec peu ou pas de réception.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><path d="M330,160 L740,168 L740,230 L392,230 Z" class="sb" style="opacity:.35"/><line x1="10" y1="230" x2="750" y2="230" class="wire"/><line x1="70" y1="230" x2="70" y2="170" class="wire thick"/><line x1="70" y1="170" x2="70" y2="154" class="ant"/><line x1="70" y1="162" x2="61" y2="150" class="ant"/><line x1="70" y1="162" x2="79" y2="150" class="ant"/><path d="M260,230 Q330,90 400,230 Z" class="cell"/><text x="330" y="205" class="lbl b" text-anchor="middle">colline</text><line x1="80" y1="156" x2="740" y2="166" class="w-amber" marker-end="url(#pijl)"/><line x1="80" y1="152" x2="600" y2="70" class="w-amber" marker-end="url(#pijl)"/><text x="600" y="200" class="lbl b red" text-anchor="middle">zone d'ombre</text><text x="600" y="218" class="lbl s" text-anchor="middle">signal faible ou nul</text><line x1="500" y1="230" x2="500" y2="200" class="wire thick"/><line x1="500" y1="200" x2="500" y2="184" class="ant"/><line x1="500" y1="192" x2="491" y2="180" class="ant"/><line x1="500" y1="192" x2="509" y2="180" class="ant"/><text x="500" y="252" class="lbl s" text-anchor="middle">récepteur</text><text x="70" y="252" class="lbl s" text-anchor="middle">émetteur</text></svg>