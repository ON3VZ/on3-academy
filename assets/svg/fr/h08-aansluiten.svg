<svg class="fig" viewBox="0 0 760 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Raccorder une station</title><desc>Alimentation avec le plus rouge et le moins noir vers l'émetteur, puis le ROS-mètre, la boîte d'accord, le câble coaxial et l'antenne.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="10" y="120" width="120" height="56" rx="10" class="box"/><text x="70.0" y="144.0" class="lbl b" text-anchor="middle">alimentation</text><text x="70.0" y="162.0" class="lbl b" text-anchor="middle">13,8 V</text><line x1="130" y1="138" x2="180" y2="138" class="w-red"/><text x="155" y="130" class="lbl s red" text-anchor="middle" style="font-size:11px">+ rouge</text><line x1="130" y1="158" x2="180" y2="158" class="wire"/><text x="155" y="176" class="lbl s" text-anchor="middle">− noir</text><rect x="180" y="110" width="130" height="76" rx="10" class="box"/><text x="245.0" y="144.0" class="lbl b" text-anchor="middle">émetteur-</text><text x="245.0" y="162.0" class="lbl b" text-anchor="middle">récepteur</text><line x1="310" y1="148" x2="350" y2="148" class="feed"/><rect x="350" y="120" width="110" height="56" rx="10" class="box"/><text x="405.0" y="144.0" class="lbl b" text-anchor="middle">ROS-</text><text x="405.0" y="162.0" class="lbl b" text-anchor="middle">mètre</text><line x1="460" y1="148" x2="500" y2="148" class="feed"/><rect x="500" y="120" width="90" height="56" rx="10" class="box"/><text x="545.0" y="144.0" class="lbl b" text-anchor="middle">boîte</text><text x="545.0" y="162.0" class="lbl b" text-anchor="middle">d'accord</text><line x1="590" y1="148" x2="690" y2="148" class="feed"/><line x1="690" y1="148" x2="690" y2="90" class="feed"/><line x1="690" y1="90" x2="690" y2="60" class="ant"/><line x1="690" y1="72" x2="678" y2="56" class="ant"/><line x1="690" y1="72" x2="702" y2="56" class="ant"/><text x="640" y="136" class="lbl s" text-anchor="middle">coaxial</text><text x="380" y="40" class="lbl b red" text-anchor="middle">Bonne polarité ! Plus sur plus, moins sur moins.</text><text x="380" y="222" class="lbl s" text-anchor="middle">ordre : alimentation, émetteur, (ROS-mètre), (boîte d'accord), coaxial, antenne</text></svg>