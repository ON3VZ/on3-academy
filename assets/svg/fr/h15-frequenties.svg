<svg class="fig" viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title>Trois types de fréquences</title><desc>Exclusive : un seul titulaire, qualité élevée, protégée. Commune : plusieurs titulaires, qualité normale, pas de protection contre les autres réseaux sur la même fréquence. Collective : plusieurs titulaires partout, aucun droit à une qualité, aucune protection.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="15" y="15" width="230" height="260" rx="12" class="box"/><text x="130" y="50" class="lbl b green" text-anchor="middle">exclusive</text><text x="130" y="90" class="lbl b" text-anchor="middle">un seul titulaire</text><text x="130" y="112" class="lbl s" text-anchor="middle">dans une zone déterminée</text><text x="130" y="175" class="lbl" text-anchor="middle">qualité de service élevée</text><text x="130" y="225" class="lbl b green" text-anchor="middle">protégée</text><rect x="265" y="15" width="230" height="260" rx="12" class="box"/><text x="380" y="50" class="lbl b accent2" text-anchor="middle">commune</text><text x="380" y="90" class="lbl b" text-anchor="middle">plusieurs titulaires</text><text x="380" y="112" class="lbl s" text-anchor="middle">dans une même zone</text><text x="380" y="130" class="lbl s" text-anchor="middle">compte tenu de l'occupation</text><text x="380" y="175" class="lbl" text-anchor="middle">qualité de service normale</text><text x="380" y="225" class="lbl b accent2" text-anchor="middle">pas de protection</text><rect x="515" y="15" width="230" height="260" rx="12" class="box"/><text x="630" y="50" class="lbl b red" text-anchor="middle">collective</text><text x="630" y="90" class="lbl b" text-anchor="middle">plusieurs titulaires</text><text x="630" y="112" class="lbl s" text-anchor="middle">dans n&#39;importe quelle zone</text><text x="630" y="130" class="lbl s" text-anchor="middle">sans tenir compte de l'occupation</text><text x="630" y="175" class="lbl" text-anchor="middle">aucun droit à une qualité</text><text x="630" y="225" class="lbl b red" text-anchor="middle">aucune protection</text><text x="380" y="252" class="lbl s" text-anchor="middle">contre les autres réseaux</text><text x="630" y="252" class="lbl s" text-anchor="middle">contre toute perturbation</text></svg>