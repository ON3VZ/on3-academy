<svg class="fig" viewBox="0 0 760 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Tore de ferrite</title><desc>Un câble enroulé quelques fois à travers un tore de ferrite. Cela freine le courant HF sur le câble.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><ellipse cx="230" cy="120" rx="70" ry="80" class="sym" style="stroke-width:26;stroke:var(--text3);opacity:.6"/><path d="M20,160 C120,160 150,50 230,60 C290,70 270,170 230,160 C190,150 200,80 240,90 C290,100 350,150 460,150" class="w-green" style="stroke-width:5"/><text x="230" y="232" class="lbl b" text-anchor="middle">tore de ferrite</text><text x="20" y="184" class="lbl s" text-anchor="start">vers la prise</text><text x="460" y="174" class="lbl s" text-anchor="end">vers l'appareil</text><text x="490" y="60" class="lbl" text-anchor="start">Câble enroulé quelques fois</text><text x="490" y="82" class="lbl" text-anchor="start">dans un tore de ferrite :</text><text x="490" y="104" class="lbl" text-anchor="start">il agit comme self de choc.</text><text x="490" y="134" class="lbl b" text-anchor="start">Courant HF : freiné.</text><text x="490" y="156" class="lbl b" text-anchor="start">230 V ou audio : passe.</text><text x="490" y="190" class="lbl b green" text-anchor="start">Sûr : vous ne coupez rien.</text></svg>