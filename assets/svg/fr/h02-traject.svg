<svg class="fig" viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg"><title>De candidat à radioamateur</title><desc>Cinq étapes : cours, examen, attestation de réussite, certificat d'opérateur avec indicatif d'appel, autorisation de station.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="15" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="42" r="20" class="sb"/><text x="55" y="48" class="lbl b" text-anchor="middle">1</text><text x="110" y="39" class="lbl b" text-anchor="start">Suivre un cours</text><text x="110" y="59" class="lbl s" text-anchor="start">auprès d'une association reconnue (p. ex. une section UBA)</text><rect x="90" y="83" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="110" r="20" class="sb"/><text x="55" y="116" class="lbl b" text-anchor="middle">2</text><text x="110" y="107" class="lbl b" text-anchor="start">Passer l'examen</text><text x="110" y="127" class="lbl s" text-anchor="start">théorie à l'IBPT (30 questions), partie pratique</text><rect x="90" y="151" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="178" r="20" class="sb"/><text x="55" y="184" class="lbl b" text-anchor="middle">3</text><text x="110" y="175" class="lbl b" text-anchor="start">Attestation de réussite</text><text x="110" y="195" class="lbl s" text-anchor="start">vous avez réussi</text><rect x="90" y="219" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="246" r="20" class="sb"/><text x="55" y="252" class="lbl b" text-anchor="middle">4</text><text x="110" y="243" class="lbl b" text-anchor="start">Certificat d'opérateur + indicatif d'appel</text><text x="110" y="263" class="lbl s" text-anchor="start">à demander à l'IBPT : vous pouvez émettre (ON3...)</text><rect x="90" y="287" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="314" r="20" class="sb"/><text x="55" y="320" class="lbl b" text-anchor="middle">5</text><text x="110" y="311" class="lbl b" text-anchor="start">Licence de station</text><text x="110" y="331" class="lbl s" text-anchor="start">pour détenir et utiliser votre propre station</text></svg>