<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Accident électrique</title><desc>Quatre étapes : couper la tension, ensuite seulement toucher, appeler le 112, premiers secours.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="20" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="47" r="20" class="sb"/><text x="55" y="53" class="lbl b" text-anchor="middle">1</text><text x="110" y="44" class="lbl b red" text-anchor="start">COUPER la tension</text><text x="110" y="64" class="lbl s" text-anchor="start">retirer la fiche, ou couper l'interrupteur général ou le disjoncteur</text><rect x="90" y="88" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="115" r="20" class="sb"/><text x="55" y="121" class="lbl b" text-anchor="middle">2</text><text x="110" y="112" class="lbl b " text-anchor="start">Ensuite seulement, toucher</text><text x="110" y="132" class="lbl s" text-anchor="start">jamais avant : sinon vous devenez vous-même une victime</text><rect x="90" y="156" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="183" r="20" class="sb"/><text x="55" y="189" class="lbl b" text-anchor="middle">3</text><text x="110" y="180" class="lbl b " text-anchor="start">Appeler les secours : 112</text><text x="110" y="200" class="lbl s" text-anchor="start">même si la victime se sent bien</text><rect x="90" y="224" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="251" r="20" class="sb"/><text x="55" y="257" class="lbl b" text-anchor="middle">4</text><text x="110" y="248" class="lbl b " text-anchor="start">Premiers secours</text><text x="110" y="268" class="lbl s" text-anchor="start">selon ce que vous avez appris, jusqu'à l'arrivée des secours</text></svg>