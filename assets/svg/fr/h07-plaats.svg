<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Emplacement et type d'antenne</title><desc>À gauche, un fil alimenté en bout, bas à côté de la maison : plus de risque de perturbation. À droite, un dipôle haut et plus loin : moins de risque.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b red" text-anchor="middle">plus de risque de perturbation</text><line x1="20" y1="280" x2="370" y2="280" class="wire"/><path d="M40,190 L105.0,130 L170,190" class="sym"/><rect x="40" y="190" width="130" height="90" class="cell"/><line x1="180" y1="280" x2="180" y2="170" class="wire thick"/><line x1="140" y1="205" x2="180" y2="170" class="ant"/><line x1="180" y1="170" x2="350" y2="160" class="ant"/><line x1="350" y1="160" x2="350" y2="280" class="wire thick"/><text x="265" y="150" class="lbl s" text-anchor="middle">fil alimenté en bout</text><text x="265" y="300" class="lbl s" text-anchor="middle">bas, tout près de la maison</text><text x="570" y="28" class="lbl b green" text-anchor="middle">moins de risque de perturbation</text><line x1="400" y1="280" x2="750" y2="280" class="wire"/><path d="M420,190 L485.0,130 L550,190" class="sym"/><rect x="420" y="190" width="130" height="90" class="cell"/><line x1="690" y1="280" x2="690" y2="70" class="wire thick"/><line x1="610" y1="70" x2="686" y2="70" class="ant"/><line x1="694" y1="70" x2="745" y2="70" class="ant"/><text x="670" y="58" class="lbl s" text-anchor="middle">dipôle</text><text x="645" y="300" class="lbl s" text-anchor="middle">haut, loin de la maison</text></svg>