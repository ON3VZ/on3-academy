<svg class="fig" viewBox="0 0 520 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Schéma pile et résistance</title><desc>Une pile de tension U est reliée à une résistance R. Un courant I circule.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="130" y1="110" x2="130" y2="144" class="wire"/><line x1="104" y1="144" x2="156" y2="144" class="wire"/><line x1="117" y1="156" x2="143" y2="156" class="wire thick"/><line x1="130" y1="156" x2="130" y2="190" class="wire"/><line x1="130" y1="110" x2="130" y2="50" class="wire"/><line x1="130" y1="50" x2="380" y2="50" class="wire"/><line x1="380" y1="50" x2="380" y2="110" class="wire"/><line x1="380" y1="110" x2="380" y2="128" class="wire"/><rect x="371" y="128" width="18" height="44" class="sym"/><line x1="380" y1="172" x2="380" y2="190" class="wire"/><line x1="380" y1="190" x2="380" y2="250" class="wire"/><line x1="380" y1="250" x2="130" y2="250" class="wire"/><line x1="130" y1="250" x2="130" y2="190" class="wire"/><text x="100" y="140" class="lbl big" text-anchor="middle">+</text><text x="100" y="176" class="lbl big" text-anchor="middle">−</text><text x="170" y="156" class="lbl big" text-anchor="start">U</text><text x="170" y="178" class="lbl s" text-anchor="start">tension (V)</text><text x="410" y="156" class="lbl big" text-anchor="start">R</text><text x="410" y="178" class="lbl s" text-anchor="start">résistance (Ω)</text><line x1="220" y1="72" x2="290" y2="72" class="dim" marker-end="url(#pijl)"/><text x="255" y="96" class="lbl s accent2" text-anchor="middle">I  courant (A)</text><text x="255" y="285" class="lbl s" text-anchor="middle">P = puissance consommée par la résistance (W)</text></svg>