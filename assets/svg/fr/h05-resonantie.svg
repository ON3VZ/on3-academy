<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Résonance d'un dipôle</title><desc>Trois dipôles : bonne longueur, trop court et trop long, avec la demi-onde du courant en pointillé.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="30" class="lbl b green" text-anchor="start">bonne longueur</text><path d="M80.0,80.0 L95.0,76.7 L110.0,73.4 L125.0,70.2 L140.0,67.0 L155.0,63.9 L170.0,60.9 L185.0,58.1 L200.0,55.3 L215.0,52.7 L230.0,50.3 L245.0,48.1 L260.0,46.0 L275.0,44.2 L290.0,42.6 L305.0,41.2 L320.0,40.1 L335.0,39.2 L350.0,38.5 L365.0,38.1 L380.0,38.0 L395.0,38.1 L410.0,38.5 L425.0,39.2 L440.0,40.1 L455.0,41.2 L470.0,42.6 L485.0,44.2 L500.0,46.0 L515.0,48.1 L530.0,50.3 L545.0,52.7 L560.0,55.3 L575.0,58.1 L590.0,60.9 L605.0,63.9 L620.0,67.0 L635.0,70.2 L650.0,73.4 L665.0,76.7 L680.0,80.0" class="env"/><line x1="80" y1="80" x2="375" y2="80" class="ant"/><line x1="385" y1="80" x2="680" y2="80" class="ant"/><circle cx="380" cy="80" r="3" class="symfill"/><text x="380" y="102" class="lbl s" text-anchor="middle">la demi-onde tient exactement : zéro aux deux extrémités</text><text x="20" y="130" class="lbl b red" text-anchor="start">trop court</text><path d="M80.0,180.0 L95.0,176.7 L110.0,173.4 L125.0,170.2 L140.0,167.0 L155.0,163.9 L170.0,160.9 L185.0,158.1 L200.0,155.3 L215.0,152.7 L230.0,150.3 L245.0,148.1 L260.0,146.0 L275.0,144.2 L290.0,142.6 L305.0,141.2 L320.0,140.1 L335.0,139.2 L350.0,138.5 L365.0,138.1 L380.0,138.0 L395.0,138.1 L410.0,138.5 L425.0,139.2 L440.0,140.1 L455.0,141.2 L470.0,142.6 L485.0,144.2 L500.0,146.0 L515.0,148.1 L530.0,150.3 L545.0,152.7 L560.0,155.3 L575.0,158.1 L590.0,160.9 L605.0,163.9 L620.0,167.0 L635.0,170.2 L650.0,173.4 L665.0,176.7 L680.0,180.0" class="env"/><line x1="170" y1="180" x2="375" y2="180" class="ant"/><line x1="385" y1="180" x2="590" y2="180" class="ant"/><circle cx="380" cy="180" r="3" class="symfill"/><text x="380" y="202" class="lbl s" text-anchor="middle">l'antenne s'arrête avant la fin de la demi-onde</text><text x="20" y="230" class="lbl b red" text-anchor="start">trop long</text><path d="M80.0,280.0 L95.0,276.7 L110.0,273.4 L125.0,270.2 L140.0,267.0 L155.0,263.9 L170.0,260.9 L185.0,258.1 L200.0,255.3 L215.0,252.7 L230.0,250.3 L245.0,248.1 L260.0,246.0 L275.0,244.2 L290.0,242.6 L305.0,241.2 L320.0,240.1 L335.0,239.2 L350.0,238.5 L365.0,238.1 L380.0,238.0 L395.0,238.1 L410.0,238.5 L425.0,239.2 L440.0,240.1 L455.0,241.2 L470.0,242.6 L485.0,244.2 L500.0,246.0 L515.0,248.1 L530.0,250.3 L545.0,252.7 L560.0,255.3 L575.0,258.1 L590.0,260.9 L605.0,263.9 L620.0,267.0 L635.0,270.2 L650.0,273.4 L665.0,276.7 L680.0,280.0" class="env"/><line x1="40" y1="280" x2="375" y2="280" class="ant"/><line x1="385" y1="280" x2="720" y2="280" class="ant"/><circle cx="380" cy="280" r="3" class="symfill"/><text x="380" y="302" class="lbl s" text-anchor="middle">l'antenne est plus longue que la demi-onde</text><text x="380" y="318" class="lbl s" text-anchor="middle">pointillé = courant dans l'antenne à la fréquence voulue (une demi-onde)</text></svg>