<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne 5/8 λ</title><desc>Élément rayonnant vertical de cinq huitièmes de longueur d'onde avec une bobine à la base, sur un plan de sol.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="130" y1="290" x2="270" y2="290" class="wire thick"/><line x1="200" y1="290" x2="200" y2="270" class="ant"/><path d="M200,214 a7,7 0 1 1 0,14 a7,7 0 1 1 0,14 a7,7 0 1 1 0,14 a7,7 0 1 1 0,14" class="sym"/><line x1="200" y1="214" x2="200" y2="30" class="ant"/><text x="218" y="246" class="lbl b" text-anchor="start">bobine</text><text x="200" y="316" class="lbl s" text-anchor="middle">plan de sol</text><line x1="160" y1="30" x2="160" y2="286" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="150" y="163.0" class="lbl accent2 b" text-anchor="end">5/8 λ</text><circle cx="200" cy="288" r="5" class="symfill"/><text x="280" y="278" class="lbl s" text-anchor="start">point d'alimentation (coaxial)</text><text x="420" y="70" class="lbl" text-anchor="start">Plus long qu'un quart d'onde (5/8 au lieu</text><text x="420" y="92" class="lbl" text-anchor="start">de 2/8). Concentre mieux le rayonnement</text><text x="420" y="114" class="lbl" text-anchor="start">vers l'horizon.</text><text x="420" y="150" class="lbl b" text-anchor="start">Pas naturellement en résonance :</text><text x="420" y="172" class="lbl" text-anchor="start">la bobine à la base l'amène sur</text><text x="420" y="194" class="lbl" text-anchor="start">la bonne fréquence.</text><text x="420" y="230" class="lbl b accent2" text-anchor="start">Signe distinctif : long brin + bobine.</text></svg>