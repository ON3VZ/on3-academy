<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Relais (répéteur)</title><desc>La station A émet sur 145,000 MHz vers un relais sur une colline. Le relais réémet la même chose sur 145,600 MHz, pour que la station B la reçoive.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="0" y1="280" x2="760" y2="280" class="wire"/><path d="M240,280 Q380,40 520,280 Z" class="cell"/><line x1="380" y1="165" x2="380" y2="95" class="wire thick"/><line x1="380" y1="95" x2="380" y2="65" class="ant"/><line x1="380" y1="77" x2="368" y2="61" class="ant"/><line x1="380" y1="77" x2="392" y2="61" class="ant"/><rect x="352" y="160" width="56" height="34" rx="6" class="box"/><text x="380" y="182" class="lbl s b" text-anchor="middle">relais</text><text x="380" y="300" class="lbl s" text-anchor="middle">colline ou bâtiment élevé</text><path d="M30,270 l0,-18 l20,0 l14,-16 l40,0 l14,16 l20,0 l0,18 z" class="cell" style="stroke:var(--text);stroke-width:2"/><circle cx="52" cy="270" r="8" class="symfill"/><circle cx="116" cy="270" r="8" class="symfill"/><line x1="80" y1="236" x2="80" y2="206" class="ant"/><line x1="80" y1="218" x2="68" y2="202" class="ant"/><line x1="80" y1="218" x2="92" y2="202" class="ant"/><path d="M620,270 l0,-18 l20,0 l14,-16 l40,0 l14,16 l20,0 l0,18 z" class="cell" style="stroke:var(--text);stroke-width:2"/><circle cx="642" cy="270" r="8" class="symfill"/><circle cx="706" cy="270" r="8" class="symfill"/><line x1="670" y1="236" x2="670" y2="206" class="ant"/><line x1="670" y1="218" x2="658" y2="202" class="ant"/><line x1="670" y1="218" x2="682" y2="202" class="ant"/><path d="M95,190 Q220,90 360,60" class="w-amber" style="stroke-width:3" marker-end="url(#pijl)"/><text x="130" y="210" class="lbl s" text-anchor="start">émet sur</text><text x="130" y="228" class="lbl b mono accent2" text-anchor="start">145,000 MHz</text><path d="M400,60 Q540,90 660,190" class="w-green" style="stroke-width:3" marker-end="url(#pijl)"/><text x="520" y="210" class="lbl s" text-anchor="start">le relais émet sur</text><text x="520" y="228" class="lbl b mono green" text-anchor="start">145,600 MHz</text><text x="380" y="26" class="lbl b" text-anchor="middle">différence = shift = 600 kHz</text><text x="80" y="300" class="lbl s" text-anchor="middle">station A</text><text x="670" y="300" class="lbl s" text-anchor="middle">station B</text><text x="130" y="246" class="lbl s" text-anchor="start">+ 1750 Hz ou CTCSS</text><text x="130" y="262" class="lbl s" text-anchor="start">pour ouvrir le relais</text></svg>