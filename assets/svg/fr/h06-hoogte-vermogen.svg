<svg class="fig" viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne plus haute ou plus de puissance</title><desc>À gauche : une antenne plus haute aide dans les deux sens. À droite : plus de puissance aide seulement en émission.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="28" class="lbl b green" text-anchor="middle">antenne plus haute</text><line x1="80" y1="200" x2="80" y2="90" class="wire thick"/><line x1="80" y1="90" x2="80" y2="74" class="ant"/><line x1="80" y1="82" x2="71" y2="70" class="ant"/><line x1="80" y1="82" x2="89" y2="70" class="ant"/><line x1="300" y1="200" x2="300" y2="90" class="wire thick"/><line x1="300" y1="90" x2="300" y2="74" class="ant"/><line x1="300" y1="82" x2="291" y2="70" class="ant"/><line x1="300" y1="82" x2="309" y2="70" class="ant"/><line x1="100" y1="90" x2="280" y2="90" class="w-green" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="190" y="80" class="lbl s" text-anchor="middle">émettre et recevoir : mieux</text><text x="570" y="28" class="lbl b accent2" text-anchor="middle">plus de puissance</text><rect x="420" y="150" width="90" height="46" rx="10" class="box"/><text x="465.0" y="178.0" class="lbl b" text-anchor="middle">1 kW</text><line x1="540" y1="200" x2="540" y2="160" class="wire thick"/><line x1="540" y1="160" x2="540" y2="144" class="ant"/><line x1="540" y1="152" x2="531" y2="140" class="ant"/><line x1="540" y1="152" x2="549" y2="140" class="ant"/><line x1="700" y1="200" x2="700" y2="160" class="wire thick"/><line x1="700" y1="160" x2="700" y2="144" class="ant"/><line x1="700" y1="152" x2="691" y2="140" class="ant"/><line x1="700" y1="152" x2="709" y2="140" class="ant"/><line x1="560" y1="150" x2="680" y2="150" class="w-amber" style="stroke-width:3" marker-end="url(#pijl)"/><text x="620" y="132" class="lbl s" text-anchor="middle">on vous entend mieux</text><line x1="680" y1="180" x2="560" y2="180" class="w-red" marker-end="url(#pijl)"/><text x="620" y="214" class="lbl s red" text-anchor="middle">vous n'entendez pas mieux l'autre</text><text x="380" y="248" class="lbl b" text-anchor="middle">Donc : d'abord l'antenne plus haut, ensuite plus de puissance.</text></svg>