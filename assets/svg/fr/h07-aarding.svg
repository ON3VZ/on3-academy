<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Terre HF</title><desc>L'émetteur a son propre fil de terre, court et épais, vers un piquet de terre. Ainsi, le courant HF ne passe pas par la terre du réseau électrique.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="20" y1="280" x2="740" y2="280" class="wire"/><rect x="20" y="280" width="720" height="40" class="cell"/><text x="40" y="306" class="lbl s" text-anchor="start">terre</text><rect x="60" y="80" width="320" height="200" class="cell" style="opacity:.5"/><text x="220" y="70" class="lbl s" text-anchor="middle">shack</text><rect x="120" y="160" width="140" height="56" rx="10" class="box"/><text x="190.0" y="193.0" class="lbl b" text-anchor="middle">émetteur</text><line x1="260" y1="200" x2="420" y2="200" class="wire thick"/><line x1="420" y1="200" x2="420" y2="300" class="wire thick"/><line x1="420" y1="280" x2="420" y2="315" class="wire thick"/><path d="M435,215 L435,268" class="w-green" style="stroke-width:3" marker-end="url(#pijl)"/><text x="458" y="236" class="lbl b green" text-anchor="start">terre HF propre :</text><text x="458" y="256" class="lbl s green" text-anchor="start">courte et épaisse vers un piquet</text><line x1="160" y1="216" x2="160" y2="250" class="wire"/><line x1="160" y1="250" x2="80" y2="250" class="wire"/><rect x="66" y="240" width="16" height="20" class="box"/><text x="90" y="272" class="lbl s red" text-anchor="start">prise de courant (terre du réseau)</text><text x="450" y="100" class="lbl" text-anchor="start">Sans terre HF, le courant HF</text><text x="450" y="122" class="lbl" text-anchor="start">cherche un chemin par la terre du</text><text x="450" y="144" class="lbl" text-anchor="start">réseau, vers d'autres appareils.</text></svg>