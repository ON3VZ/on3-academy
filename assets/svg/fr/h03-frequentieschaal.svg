<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Échelle des fréquences</title><desc>Une échelle du bas vers le haut : réseau électrique 50 hertz, son audible, parole, et les bandes radio HF, VHF et UHF.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="30" y1="150" x2="740" y2="150" class="axisline" marker-end="url(#pijlas)"/><line x1="30.0" y1="145" x2="30.0" y2="155" class="axisline"/><text x="30.0" y="172" class="lbl s mono" text-anchor="middle">10 Hz</text><line x1="185.55555555555554" y1="145" x2="185.55555555555554" y2="155" class="axisline"/><text x="185.55555555555554" y="172" class="lbl s mono" text-anchor="middle">1 kHz</text><line x1="418.8888888888889" y1="145" x2="418.8888888888889" y2="155" class="axisline"/><text x="418.8888888888889" y="172" class="lbl s mono" text-anchor="middle">1 MHz</text><line x1="652.2222222222222" y1="145" x2="652.2222222222222" y2="155" class="axisline"/><text x="652.2222222222222" y="172" class="lbl s mono" text-anchor="middle">1 GHz</text><rect x="107.8" y="95" width="169.3" height="36" rx="4" class="bandaf"/><text x="192.4035489632765" y="118.0" class="lbl b" text-anchor="middle">AF : audible</text><text x="192.4035489632765" y="89" class="lbl s mono" text-anchor="middle">100 Hz à 15 kHz</text><rect x="144.9" y="40" width="77.8" height="30" rx="4" class="bandsp"/><text x="183.77609758930708" y="60.0" class="lbl b" text-anchor="middle">parole</text><text x="183.77609758930708" y="34" class="lbl s mono" text-anchor="middle">300 Hz à 3 kHz</text><rect x="456.0" y="190" width="77.8" height="36" rx="4" class="bandhf"/><text x="494.8872087004182" y="213.0" class="lbl b" text-anchor="middle">HF</text><text x="494.8872087004182" y="184" class="lbl s mono" text-anchor="middle">3 à 30 MHz</text><rect x="533.8" y="190" width="77.8" height="36" rx="4" class="bandvhf"/><text x="572.6649864781959" y="213.0" class="lbl b" text-anchor="middle">VHF</text><rect x="611.6" y="190" width="77.8" height="36" rx="4" class="banduhf"/><text x="650.4427642559738" y="213.0" class="lbl b" text-anchor="middle">UHF</text><text x="572.6649864781959" y="244" class="lbl s mono" text-anchor="middle">30 à 300 MHz</text><text x="650.4427642559738" y="262" class="lbl s mono" text-anchor="middle">300 à 3000 MHz</text><text x="473.2532225594681" y="290" class="lbl s" text-anchor="middle">RF : radiofréquences (à partir d'environ 10 kHz)</text><line x1="84.36433367057924" y1="140" x2="84.36433367057924" y2="160" class="dim"/><text x="84.36433367057924" y="196" class="lbl s accent2" text-anchor="middle">réseau</text><text x="84.36433367057924" y="212" class="lbl s accent2" text-anchor="middle">50 Hz</text></svg>