<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne quart d'onde</title><desc>Un brin vertical d'un quart de longueur d'onde sur un plan de sol. Le plan de sol forme l'image miroir, ensemble une demi-longueur d'onde.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="60" y="190" width="340" height="12" class="cell"/><text x="230" y="224" class="lbl s" text-anchor="middle">plan de sol (plaque métallique ou fils dans le sol)</text><line x1="230" y1="186" x2="230" y2="40" class="ant"/><line x1="230" y1="300" x2="230" y2="234" class="ghost"/><line x1="190" y1="40" x2="190" y2="186" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="180" y="118.0" class="lbl accent2 b" text-anchor="end">λ/4</text><text x="244" y="60" class="lbl b" text-anchor="start">élément rayonnant</text><text x="244" y="290" class="lbl s" text-anchor="start">image miroir</text><text x="244" y="306" class="lbl s" text-anchor="start">(n'existe pas vraiment)</text><circle cx="230" cy="186" r="5" class="symfill"/><text x="242" y="178" class="lbl s" text-anchor="start">point d'alimentation (coaxial)</text><text x="470" y="70" class="lbl b" text-anchor="start">Le plan de sol agit comme un miroir.</text><text x="470" y="96" class="lbl" text-anchor="start">Avec son image miroir, un quart d'onde</text><text x="470" y="118" class="lbl" text-anchor="start">se comporte comme un dipôle</text><text x="470" y="140" class="lbl" text-anchor="start">d'une demi-longueur d'onde.</text><text x="470" y="180" class="lbl b mono accent2" text-anchor="start">λ/4 + λ/4 (miroir) = λ/2</text></svg>