<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Structure du câble coaxial</title><desc>De l'intérieur vers l'extérieur : conducteur central, diélectrique, blindage et gaine.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="420" y="64" width="300" height="92" rx="8" class="symfill" opacity="0.85"/><rect x="300" y="72" width="130" height="76" class="cell"/><defs><pattern id="vlecht" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="wire" style="stroke-width:3"/></pattern></defs><rect x="300" y="72" width="130" height="76" fill="url(#vlecht)" class="sym"/><rect x="170" y="82" width="140" height="56" class="box"/><rect x="40" y="104" width="140" height="12" class="carrier"/><rect x="40" y="104" width="140" height="12" fill="var(--amber)"/><line x1="90" y1="120" x2="90" y2="192" class="guide2"/><text x="90" y="210" class="lbl b" text-anchor="middle">conducteur central</text><text x="90" y="228" class="lbl s" text-anchor="middle">cuivre : transporte le signal</text><line x1="240" y1="140" x2="240" y2="236" class="guide2"/><text x="240" y="254" class="lbl b" text-anchor="middle">diélectrique</text><text x="240" y="272" class="lbl s" text-anchor="middle">isolant : garde l'âme au milieu</text><line x1="365" y1="150" x2="365" y2="192" class="guide2"/><text x="365" y="210" class="lbl b" text-anchor="middle">blindage</text><text x="365" y="228" class="lbl s" text-anchor="middle">tresse : garde le signal dedans</text><line x1="570" y1="158" x2="570" y2="236" class="guide2"/><text x="570" y="254" class="lbl b" text-anchor="middle">gaine</text><text x="570" y="272" class="lbl s" text-anchor="middle">extérieur : contre l'eau et la météo</text><text x="380" y="30" class="lbl s" text-anchor="middle">câble coaxial, dénudé couche par couche</text></svg>