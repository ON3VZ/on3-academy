<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Dipôle</title><desc>Un dipôle est interrompu et alimenté en son milieu. Longueur : une demi-longueur d'onde. Le courant est maximal au milieu et nul aux extrémités.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="30" class="lbl b accent2" text-anchor="start">dipôle horizontal</text><line x1="40" y1="120" x2="312" y2="120" class="ant"/><line x1="328" y1="120" x2="600" y2="120" class="ant"/><path d="M40.0,120.0 L54.0,115.3 L68.0,110.6 L82.0,106.0 L96.0,101.5 L110.0,97.0 L124.0,92.8 L138.0,88.7 L152.0,84.7 L166.0,81.0 L180.0,77.6 L194.0,74.4 L208.0,71.5 L222.0,68.8 L236.0,66.5 L250.0,64.6 L264.0,62.9 L278.0,61.7 L292.0,60.7 L306.0,60.2 L320.0,60.0 L334.0,60.2 L348.0,60.7 L362.0,61.7 L376.0,62.9 L390.0,64.6 L404.0,66.5 L418.0,68.8 L432.0,71.5 L446.0,74.4 L460.0,77.6 L474.0,81.0 L488.0,84.7 L502.0,88.7 L516.0,92.8 L530.0,97.0 L544.0,101.5 L558.0,106.0 L572.0,110.6 L586.0,115.3 L600.0,120.0" class="env"/><text x="320" y="52" class="lbl s" text-anchor="middle">courant : maximal au milieu</text><text x="40" y="145" class="lbl s" text-anchor="middle">0</text><text x="600" y="145" class="lbl s" text-anchor="middle">0</text><line x1="312" y1="120" x2="312" y2="175" class="feed"/><line x1="328" y1="120" x2="328" y2="175" class="feed"/><text x="320" y="195" class="lbl s" text-anchor="middle">point d'alimentation : vers émetteur / récepteur</text><line x1="40" y1="240" x2="600" y2="240" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="320.0" y="232" class="lbl accent2 b" text-anchor="middle">λ/2 (une demi-longueur d'onde)</text><text x="690" y="30" class="lbl b accent2" text-anchor="middle">dipôle vertical</text><line x1="690" y1="50" x2="690" y2="172" class="ant"/><line x1="690" y1="188" x2="690" y2="310" class="ant"/><line x1="690" y1="172" x2="735" y2="172" class="wire"/><line x1="690" y1="188" x2="735" y2="188" class="wire"/></svg>