<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>L'électricité comme de l'eau</title><desc>Un château d'eau avec un tuyau qui se rétrécit à un endroit. La pression est la tension, l'écoulement est le courant, le tuyau étroit est la résistance.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="40" y="40" width="120" height="160" rx="8" class="tank"/><rect x="44" y="80" width="112" height="116" rx="4" class="water"/><text x="100" y="230" class="lbl b" text-anchor="middle">château d'eau</text><text x="100" y="250" class="lbl s" text-anchor="middle">hauteur = pression</text><path d="M160,170 L300,170 L330,182 L470,182 L500,170 L700,170" class="pipe"/><path d="M160,196 L300,196 L330,186 L470,186 L500,196 L700,196" class="pipe"/><line x1="200" y1="183" x2="270" y2="183" class="flow" marker-end="url(#pijl)"/><line x1="540" y1="183" x2="640" y2="183" class="flow" marker-end="url(#pijl)"/><text x="400" y="160" class="lbl b" text-anchor="middle">tuyau étroit</text><text x="400" y="214" class="lbl s" text-anchor="middle">freine le courant</text><text x="590" y="160" class="lbl b" text-anchor="middle">l'eau s'écoule</text><text x="260" y="252" class="lbl s" text-anchor="start">pression de l'eau</text><text x="470" y="252" class="lbl b" text-anchor="start">→  tension U</text><text x="640" y="252" class="lbl s mono" text-anchor="start">volt (V)</text><text x="260" y="274" class="lbl s" text-anchor="start">eau par seconde</text><text x="470" y="274" class="lbl b" text-anchor="start">→  courant I</text><text x="640" y="274" class="lbl s mono" text-anchor="start">ampère (A)</text><text x="260" y="296" class="lbl s" text-anchor="start">largeur du tuyau</text><text x="470" y="296" class="lbl b" text-anchor="start">→  résistance R</text><text x="640" y="296" class="lbl s mono" text-anchor="start">ohm (Ω)</text></svg>