<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne yagi</title><desc>Vue de dessus d'une yagi : réflecteur à l'arrière, élément rayonnant alimenté, directeurs à l'avant. Le rayonnement part du côté des directeurs.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="80" y1="165" x2="600" y2="165" class="wire thick"/><line x1="120" y1="50.0" x2="120" y2="280.0" class="ant"/><text x="120" y="28.0" class="lbl b" text-anchor="middle">réflecteur</text><text x="120" y="44.0" class="lbl s" text-anchor="middle">un peu plus long</text><line x1="260" y1="62.5" x2="260" y2="159" class="ant"/><line x1="260" y1="171" x2="260" y2="267.5" class="ant"/><line x1="260" y1="169" x2="230" y2="205" class="feed"/><text x="226" y="225" class="lbl s" text-anchor="end">coaxial</text><text x="260" y="40.5" class="lbl b" text-anchor="middle">él. rayonnant</text><text x="260" y="56.5" class="lbl s" text-anchor="middle">dipôle, alimenté</text><line x1="400" y1="75.0" x2="400" y2="255.0" class="ant"/><text x="400" y="53.0" class="lbl b" text-anchor="middle">directeur</text><text x="400" y="69.0" class="lbl s" text-anchor="middle">un peu plus court</text><line x1="530" y1="82.5" x2="530" y2="247.5" class="ant"/><text x="530" y="60.5" class="lbl b" text-anchor="middle">directeur</text><text x="530" y="76.5" class="lbl s" text-anchor="middle">encore plus court</text><text x="330" y="187" class="lbl s" text-anchor="middle">support (boom)</text><line x1="620" y1="165" x2="740" y2="165" class="dim" marker-end="url(#pijl)"/><text x="680" y="153" class="lbl b accent2" text-anchor="middle">direction</text><text x="680" y="191" class="lbl b accent2" text-anchor="middle">rayonnement</text><text x="380" y="316" class="lbl s" text-anchor="middle">vue de dessus : l'onde part du côté des directeurs</text></svg>