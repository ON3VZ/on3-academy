<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Lampe de poche en schéma</title><desc>Pile, interrupteur et ampoule dans un circuit fermé. Le courant va du plus, passe par l'interrupteur et l'ampoule, et revient au moins.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="140" y1="110" x2="140" y2="144" class="wire"/><line x1="114" y1="144" x2="166" y2="144" class="wire"/><line x1="127" y1="156" x2="153" y2="156" class="wire thick"/><line x1="140" y1="156" x2="140" y2="190" class="wire"/><line x1="140" y1="110" x2="140" y2="50" class="wire"/><line x1="140" y1="50" x2="320" y2="50" class="wire"/><line x1="320" y1="50" x2="340" y2="50" class="wire"/><circle cx="344" cy="50" r="4" class="sym"/><line x1="344" y1="50" x2="378" y2="32" class="wire"/><circle cx="378" cy="50" r="4" class="symfill"/><line x1="378" y1="50" x2="400" y2="50" class="wire"/><line x1="400" y1="50" x2="560" y2="50" class="wire"/><line x1="560" y1="50" x2="560" y2="110" class="wire"/><circle cx="560" cy="150" r="20" class="sym"/><line x1="546" y1="136" x2="574" y2="164" class="wire"/><line x1="546" y1="164" x2="574" y2="136" class="wire"/><line x1="560" y1="130" x2="560" y2="110" class="wire"/><line x1="560" y1="170" x2="560" y2="250" class="wire"/><line x1="560" y1="250" x2="140" y2="250" class="wire"/><line x1="140" y1="250" x2="140" y2="190" class="wire"/><text x="110" y="140" class="lbl big" text-anchor="middle">+</text><text x="110" y="178" class="lbl big" text-anchor="middle">−</text><text x="186" y="156" class="lbl b" text-anchor="start">pile</text><text x="186" y="176" class="lbl s" text-anchor="start">tension U</text><text x="360" y="30" class="lbl b" text-anchor="middle">interrupteur</text><text x="596" y="146" class="lbl b" text-anchor="start">ampoule</text><text x="596" y="166" class="lbl s" text-anchor="start">résistance R</text><line x1="250" y1="72" x2="310" y2="72" class="dim" marker-end="url(#pijl)"/><text x="280" y="92" class="lbl s accent2" text-anchor="middle">courant I</text><line x1="430" y1="228" x2="370" y2="228" class="dim" marker-end="url(#pijl)"/><text x="650" y="250" class="lbl s" text-anchor="start">circuit fermé :</text><text x="650" y="268" class="lbl s" text-anchor="start">le courant circule</text></svg>