<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Raccorder une fiche secteur</title><desc>Le brun est la phase, le bleu est le neutre, le jaune-vert est la terre.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="440" y="80" width="200" height="150" rx="40" class="cell" style="stroke:var(--text);stroke-width:2"/><text x="540" y="262" class="lbl s" text-anchor="middle">fiche (arrière ouvert)</text><circle cx="490" cy="160" r="12" class="sym"/><text x="490" y="196" class="lbl s" text-anchor="middle">phase</text><circle cx="590" cy="160" r="12" class="sym"/><text x="590" y="196" class="lbl s" text-anchor="middle">neutre</text><rect x="525" y="96" width="30" height="20" rx="4" class="sym"/><text x="562" y="112" class="lbl s" text-anchor="start">terre</text><path d="M30,50 H590 V148" style="fill:none;stroke:#2B6CB0;stroke-width:7"/><text x="30" y="38" class="lbl b" text-anchor="start">bleu</text><text x="130" y="38" class="lbl s" text-anchor="start">neutre (tension du réseau)</text><path d="M30,100 H490 V148" style="fill:none;stroke:#8B5A2B;stroke-width:7"/><text x="30" y="88" class="lbl b" text-anchor="start">brun</text><text x="130" y="88" class="lbl s" text-anchor="start">phase (tension du réseau)</text><path d="M30,250 H420 V230 Q420,200 540,200 V116" style="fill:none;stroke:#9ACD32;stroke-width:7"/><path d="M30,250 H420 V230 Q420,200 540,200 V116" style="fill:none;stroke:#E6C619;stroke-width:7;stroke-dasharray:10 10"/><text x="30" y="238" class="lbl b" text-anchor="start">jaune-vert</text><text x="130" y="238" class="lbl s" text-anchor="start">terre (sécurité)</text></svg>