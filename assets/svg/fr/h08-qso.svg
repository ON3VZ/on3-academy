<svg class="fig" viewBox="0 0 760 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>Déroulement d'une liaison</title><desc>Six étapes : écouter, demander si la fréquence est libre, lancer appel (CQ), réponse, changer de fréquence, terminer.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="20" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="48" r="20" class="sb"/><text x="55" y="54" class="lbl b" text-anchor="middle">1</text><text x="110" y="44" class="lbl b" text-anchor="start">Écouter</text><text x="110" y="64" class="lbl s" text-anchor="start">la fréquence est-elle libre ? Écoutez d'abord un moment.</text><rect x="90" y="94" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="122" r="20" class="sb"/><text x="55" y="128" class="lbl b" text-anchor="middle">2</text><text x="110" y="118" class="lbl b" text-anchor="start">Demander</text><text x="110" y="138" class="lbl s" text-anchor="start">« Cette fréquence est-elle occupée ? Ici ON3XYZ. »</text><rect x="90" y="168" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="196" r="20" class="sb"/><text x="55" y="202" class="lbl b" text-anchor="middle">3</text><text x="110" y="192" class="lbl b" text-anchor="start">Lancer appel (CQ)</text><text x="110" y="212" class="lbl s" text-anchor="start">« CQ CQ CQ, ici ON3XYZ ... qui appelle et passe à l'écoute. »</text><rect x="90" y="242" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="270" r="20" class="sb"/><text x="55" y="276" class="lbl b" text-anchor="middle">4</text><text x="110" y="266" class="lbl b" text-anchor="start">Quelqu'un répond</text><text x="110" y="286" class="lbl s" text-anchor="start">notez son indicatif d'appel, donnez un report</text><rect x="90" y="316" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="344" r="20" class="sb"/><text x="55" y="350" class="lbl b" text-anchor="middle">5</text><text x="110" y="340" class="lbl b" text-anchor="start">Changer de fréquence (QSY)</text><text x="110" y="360" class="lbl s" text-anchor="start">en VHF/UHF : quittez la fréquence d'appel</text><rect x="90" y="390" width="620" height="56" rx="10" class="box"/><circle cx="55" cy="418" r="20" class="sb"/><text x="55" y="424" class="lbl b" text-anchor="middle">6</text><text x="110" y="414" class="lbl b" text-anchor="start">Terminer</text><text x="110" y="434" class="lbl s" text-anchor="start">saluer, répéter les indicatifs, noter dans le carnet de trafic</text></svg>