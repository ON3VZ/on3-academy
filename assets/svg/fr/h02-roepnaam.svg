<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Structure d'un indicatif d'appel</title><desc>Un indicatif d'appel se compose du préfixe de pays ON, d'un chiffre 3, des lettres XYZ et éventuellement d'un suffixe /P.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="60" y="40" width="160" height="80" rx="10" class="sb"/><text x="140.0" y="96" class="lbl big mono" text-anchor="middle">ON</text><text x="140.0" y="150" class="lbl b" text-anchor="middle">pays</text><text x="140.0" y="172" class="lbl s" text-anchor="middle">Belgique : ON à OT</text><rect x="240" y="40" width="90" height="80" rx="10" class="sb"/><text x="285.0" y="96" class="lbl big mono" text-anchor="middle">3</text><text x="285.0" y="150" class="lbl b" text-anchor="middle">chiffre</text><text x="285.0" y="172" class="lbl s" text-anchor="middle">un seul chiffre</text><rect x="350" y="40" width="170" height="80" rx="10" class="sb"/><text x="435.0" y="96" class="lbl big mono" text-anchor="middle">XYZ</text><text x="435.0" y="150" class="lbl b" text-anchor="middle">lettres</text><text x="435.0" y="172" class="lbl s" text-anchor="middle">une à trois lettres</text><rect x="540" y="40" width="140" height="80" rx="10" class="cell"/><text x="610.0" y="96" class="lbl big mono" text-anchor="middle">/P</text><text x="610.0" y="150" class="lbl b" text-anchor="middle">suffixe</text><text x="610.0" y="172" class="lbl s" text-anchor="middle">lieu d'émission (parfois)</text><text x="380" y="214" class="lbl b accent2" text-anchor="middle">ON3XYZ/P = radioamateur belge, station portable</text></svg>