<svg class="fig" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg"><title>Les 9 symboles à connaître</title><desc>Pile, ampoule à incandescence, résistance, fusible, interrupteur, microphone, haut-parleur, antenne et terre.</desc><rect x="20" y="15" width="230" height="120" rx="10" class="cell"/><line x1="95" y1="67" x2="129" y2="67" class="wire"/><line x1="129" y1="41" x2="129" y2="93" class="wire"/><line x1="141" y1="54" x2="141" y2="80" class="wire thick"/><line x1="141" y1="67" x2="175" y2="67" class="wire"/><text x="135" y="117" class="lbl b" text-anchor="middle">pile</text><text x="135" y="132" class="lbl s" text-anchor="middle">source de tension</text><rect x="265" y="15" width="230" height="120" rx="10" class="cell"/><line x1="340" y1="67" x2="362" y2="67" class="wire"/><circle cx="380" cy="67" r="18" class="sym"/><line x1="367.3" y1="54.3" x2="392.7" y2="79.7" class="wire"/><line x1="367.3" y1="79.7" x2="392.7" y2="54.3" class="wire"/><line x1="398" y1="67" x2="420" y2="67" class="wire"/><text x="380" y="117" class="lbl b" text-anchor="middle">ampoule</text><rect x="510" y="15" width="230" height="120" rx="10" class="cell"/><line x1="585" y1="67" x2="603" y2="67" class="wire"/><rect x="603" y="58" width="44" height="18" class="sym"/><line x1="647" y1="67" x2="665" y2="67" class="wire"/><text x="625" y="117" class="lbl b" text-anchor="middle">résistance</text><rect x="20" y="150" width="230" height="120" rx="10" class="cell"/><line x1="95" y1="202" x2="175" y2="202" class="wire"/><rect x="113" y="193" width="44" height="18" class="sym"/><text x="135" y="252" class="lbl b" text-anchor="middle">fusible</text><text x="135" y="267" class="lbl s" text-anchor="middle">fil à travers le bloc</text><rect x="265" y="150" width="230" height="120" rx="10" class="cell"/><line x1="340" y1="202" x2="360" y2="202" class="wire"/><circle cx="364" cy="202" r="4" class="sym"/><line x1="364" y1="202" x2="398" y2="184" class="wire"/><circle cx="398" cy="202" r="