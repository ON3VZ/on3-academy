<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Comment se déplace une onde radio</title><desc>Trois cas : en ligne droite et de plus en plus faible, réfléchie sur une paroi, déviée autour d'un bord.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="28" class="lbl b accent2" text-anchor="start">1. tout droit, s'affaiblit</text><line x1="40" y1="120" x2="40" y2="80" class="wire thick"/><line x1="40" y1="80" x2="40" y2="64" class="ant"/><line x1="40" y1="72" x2="31" y2="60" class="ant"/><line x1="40" y1="72" x2="49" y2="60" class="ant"/><line x1="70" y1="70" x2="110" y2="70" class="w-amber" style="stroke-width:5"/><line x1="120" y1="70" x2="160" y2="70" class="w-amber" style="stroke-width:3.5"/><line x1="170" y1="70" x2="210" y2="70" class="w-amber" style="stroke-width:2.2"/><line x1="220" y1="70" x2="260" y2="70" class="w-amber" style="stroke-width:1.2"/><line x1="270" y1="70" x2="290" y2="70" class="arrow" marker-end="url(#pijl)"/><text x="170" y="100" class="lbl s" text-anchor="middle">épais = fort, fin = faible</text><text x="330" y="28" class="lbl b accent2" text-anchor="start">2. réfléchie</text><rect x="500" y="40" width="16" height="110" class="cell"/><line x1="340" y1="60" x2="498" y2="100" class="w-amber" marker-end="url(#pijl)"/><line x1="498" y1="100" x2="360" y2="140" class="w-amber" marker-end="url(#pijl)"/><text x="508" y="170" class="lbl s" text-anchor="middle">paroi</text><text x="560" y="28" class="lbl b accent2" text-anchor="start">3. déviée</text><path d="M560,150 L640,150 L640,80 L660,80 L660,150 Z" class="cell"/><path d="M570,70 L640,70 Q680,70 700,120" class="w-amber" marker-end="url(#pijl)"/><text x="660" y="190" class="lbl s" text-anchor="middle">autour d'un bord</text><line x1="20" y1="215" x2="740" y2="215" class="guide2"/><text x="380" y="245" class="lbl b" text-anchor="middle">Une onde radio se comporte comme la lumière :</text><text x="380" y="270" class="lbl" text-anchor="middle">en ligne droite, sauf réflexion ou déviation, et plus c'est loin, plus c'est faible.</text></svg>