<svg class="fig" viewBox="0 0 760 380" role="img" xmlns="http://www.w3.org/2000/svg"><title>Installation sûre</title><desc>Une maison avec shack, une antenne sur un mât avec protection contre la foudre et piquet de terre, bien à l'écart d'une ligne électrique aérienne, deux personnes pendant le montage.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="0" y1="340" x2="760" y2="340" class="wire"/><path d="M60,200 L200,110 L340,200" class="sym"/><rect x="60" y="200" width="280" height="140" class="cell"/><rect x="90" y="260" width="120" height="50" rx="10" class="box"/><text x="150.0" y="290.0" class="lbl b" text-anchor="middle">shack</text><line x1="420" y1="340" x2="420" y2="60" class="wire thick"/><line x1="380" y1="60" x2="416" y2="60" class="ant"/><line x1="424" y1="60" x2="460" y2="60" class="ant"/><text x="470" y="64" class="lbl s" text-anchor="start">antenne haute</text><path d="M480,0 l-20,30 h14 l-14,26" class="w-red" style="stroke-width:3"/><text x="492" y="30" class="lbl s red" text-anchor="start">la foudre frappe les points hauts</text><line x1="420" y1="80" x2="380" y2="80" class="feed"/><line x1="380" y1="80" x2="380" y2="290" class="feed"/><rect x="364" y="290" width="32" height="24" rx="4" class="box"/><text x="380" y="372" class="lbl s" text-anchor="middle">parafoudre + piquet de terre</text><line x1="380" y1="314" x2="380" y2="340" class="wire thick"/><line x1="367.0" y1="342" x2="393.0" y2="342" class="wire"/><line x1="371.3333333333333" y1="348" x2="388.6666666666667" y2="348" class="wire"/><line x1="375.6666666666667" y1="354" x2="384.3333333333333" y2="354" class="wire"/><line x1="364" y1="302" x2="210" y2="285" class="feed"/><line x1="620" y1="340" x2="620" y2="80" class="wire"/><line x1="590" y1="90" x2="650" y2="90" class="wire"/><line x1="560" y1="96" x2="760" y2="96" class="w-red"/><text x="700" y="120" class="lbl s" text-anchor="middle">ligne électrique</text><text x="700" y="136" class="lbl s" text-anchor="middle">aérienne</text><line x1="440" y1="180" x2="610" y2="180" class="dim" marker-start="url(#pijl)" marker-end="url(#pijl)"/><text x="525" y="172" class="lbl b accent2" text-anchor="middle">rester à distance</text><circle cx="510" cy="268.0" r="8.8" class="sym"/><line x1="510" y1="276.8" x2="510" y2="312.0" class="sym"/><line x1="510" y1="312.0" x2="498.8" y2="340" class="sym"/><line x1="510" y1="312.0" x2="521.2" y2="340" class="sym"/><line x1="510" y1="290.4" x2="486.0" y2="300.0" class="sym"/><line x1="510" y1="290.4" x2="527.6" y2="303.2" class="sym"/><circle cx="560" cy="268.0" r="8.8" class="sym"/><line x1="560" y1="276.8" x2="560" y2="312.0" class="sym"/><line x1="560" y1="312.0" x2="548.8" y2="340" class="sym"/><line x1="560" y1="312.0" x2="571.2" y2="340" class="sym"/><line x1="560" y1="290.4" x2="536.0" y2="300.0" class="sym"/><line x1="560" y1="290.4" x2="577.6" y2="303.2" class="sym"/><text x="535" y="365" class="lbl s b" text-anchor="middle">jamais seul</text></svg>