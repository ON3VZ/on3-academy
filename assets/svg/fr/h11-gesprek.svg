<svg class="fig" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg"><title>Exemple de conversation avec des codes Q</title><desc>Six tours de parole entre deux stations A et B avec QRZ, QTH, QSL, QRP, QRM, QSY et 73, chacun avec une explication.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="15" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="42" r="16" class="sb"/><text x="46" y="48" class="lbl b" text-anchor="middle">A</text><text x="74" y="39" class="lbl b mono" text-anchor="start">CQ CQ CQ, ici ON3AAA, QRZ?</text><text x="74" y="59" class="lbl s" text-anchor="start">qui m'appelle ?</text><rect x="140" y="81" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="108" r="16" class="sb"/><text x="166" y="114" class="lbl b" text-anchor="middle">B</text><text x="194" y="105" class="lbl b mono" text-anchor="start">ON3AAA, ici ON3BBB. Votre QTH ?</text><text x="194" y="125" class="lbl s" text-anchor="start">quelle est votre position ?</text><rect x="20" y="147" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="174" r="16" class="sb"/><text x="46" y="180" class="lbl b" text-anchor="middle">A</text><text x="74" y="171" class="lbl b mono" text-anchor="start">Mon QTH est Gand. Votre report est 59.</text><text x="74" y="191" class="lbl s" text-anchor="start">position et intelligibilité</text><rect x="140" y="213" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="240" r="16" class="sb"/><text x="166" y="246" class="lbl b" text-anchor="middle">B</text><text x="194" y="237" class="lbl b mono" text-anchor="start">QSL, 59. J'utilise 25 W, ce n'est pas du QRP.</text><text x="194" y="257" class="lbl s" text-anchor="start">réception confirmée</text><rect x="20" y="279" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="306" r="16" class="sb"/><text x="46" y="312" class="lbl b" text-anchor="middle">A</text><text x="74" y="303" class="lbl b mono" text-anchor="start">QRM ici, je dois faire QSY sur 14,250.</text><text x="74" y="323" class="lbl s" text-anchor="start">brouillage, autre fréquence</text><rect x="140" y="345" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="372" r="16" class="sb"/><text x="166" y="378" class="lbl b" text-anchor="middle">B</text><text x="194" y="369" class="lbl b mono" text-anchor="start">QSL. 73 et à la prochaine, ON3BBB terminé.</text><text x="194" y="389" class="lbl s" text-anchor="start">confirmé, salutations</text></svg>