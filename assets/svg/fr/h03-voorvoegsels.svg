<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Préfixes</title><desc>Un escalier de milli à l'unité de base, puis kilo, puis méga, chaque fois un facteur 1000.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="15" y="40" width="130" height="90" rx="10" class="cell"/><text x="80" y="82" class="lbl big" text-anchor="middle">m</text><text x="80" y="106" class="lbl b" text-anchor="middle">milli</text><text x="80" y="124" class="lbl s mono" text-anchor="middle">× 0,001</text><line x1="149" y1="66" x2="201" y2="66" class="dim" marker-end="url(#pijl)"/><text x="175" y="56" class="lbl s mono" text-anchor="middle">÷ 1000</text><line x1="201" y1="106" x2="149" y2="106" class="dim" marker-end="url(#pijl)"/><text x="175" y="126" class="lbl s mono" text-anchor="middle">× 1000</text><rect x="205" y="40" width="130" height="90" rx="10" class="cell"/><text x="270" y="82" class="lbl b" text-anchor="middle">V, A, Ω, W</text><text x="270" y="106" class="lbl b" text-anchor="middle">base</text><text x="270" y="124" class="lbl s mono" text-anchor="middle">× 1</text><line x1="339" y1="66" x2="391" y2="66" class="dim" marker-end="url(#pijl)"/><text x="365" y="56" class="lbl s mono" text-anchor="middle">÷ 1000</text><line x1="391" y1="106" x2="339" y2="106" class="dim" marker-end="url(#pijl)"/><text x="365" y="126" class="lbl s mono" text-anchor="middle">× 1000</text><rect x="395" y="40" width="130" height="90" rx="10" class="cell"/><text x="460" y="82" class="lbl big" text-anchor="middle">k</text><text x="460" y="106" class="lbl b" text-anchor="middle">kilo</text><text x="460" y="124" class="lbl s mono" text-anchor="middle">× 1 000</text><line x1="529" y1="66" x2="581" y2="66" class="dim" marker-end="url(#pijl)"/><text x="555" y="56" class="lbl s mono" text-anchor="middle">÷ 1000</text><line x1="581" y1="106" x2="529" y2="106" class="dim" marker-end="url(#pijl)"/><text x="555" y="126" class="lbl s mono" text-anchor="middle">× 1000</text><rect x="585" y="40" width="130" height="90" rx="10" class="cell"/><text x="650" y="82" class="lbl big" text-anchor="middle">M</text><text x="650" y="106" class="lbl b" text-anchor="middle">méga</text><text x="650" y="124" class="lbl s mono" text-anchor="middle">× 1 000 000</text><text x="380" y="170" class="lbl s" text-anchor="middle">Vers la droite (unité plus grande) : le nombre diminue, diviser par 1000.</text><text x="380" y="192" class="lbl s" text-anchor="middle">Vers la gauche (unité plus petite) : le nombre augmente, fois 1000.</text><text x="380" y="220" class="lbl b red" text-anchor="middle">Attention : petit m = milli, grand M = méga. Un milliard de fois d'écart !</text></svg>