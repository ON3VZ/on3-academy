<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Ondes radio et bâtiments</title><desc>Un mur en béton arrête en grande partie l'onde, une fenêtre en verre la laisse passer.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="300" y="40" width="260" height="220" class="cell"/><rect x="296" y="40" width="12" height="220" class="symfill" opacity="0.7"/><rect x="296" y="110" width="12" height="60" class="sb"/><text x="318" y="62" class="lbl s b red" text-anchor="start">mur (béton)</text><text x="318" y="104" class="lbl s b green" text-anchor="start">fenêtre (verre)</text><text x="318" y="250" class="lbl s b red" text-anchor="start">mur (béton)</text><line x1="40" y1="140" x2="500" y2="140" class="w-amber" marker-end="url(#pijl)"/><line x1="40" y1="75" x2="290" y2="75" class="w-red" marker-end="url(#pijl)"/><text x="160" y="65" class="lbl s" text-anchor="middle">heurte le mur</text><line x1="40" y1="210" x2="290" y2="210" class="w-red" marker-end="url(#pijl)"/><text x="160" y="200" class="lbl s" text-anchor="middle">heurte le mur</text><text x="160" y="130" class="lbl s" text-anchor="middle">traverse le verre</text><text x="430" y="190" class="lbl s" text-anchor="middle">à l'intérieur : le mieux</text><text x="430" y="206" class="lbl s" text-anchor="middle">près de la fenêtre</text><line x1="690" y1="260" x2="690" y2="140" class="wire thick"/><line x1="690" y1="140" x2="690" y2="124" class="ant"/><line x1="690" y1="132" x2="681" y2="120" class="ant"/><line x1="690" y1="132" x2="699" y2="120" class="ant"/><text x="750" y="284" class="lbl s" text-anchor="end">antenne extérieure : le mieux</text></svg>