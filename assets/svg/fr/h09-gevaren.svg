<svg class="fig" viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Deux dangers</title><desc>À gauche : une haute tension donne un danger d'électrocution. À droite : un courant élevé donne surchauffe et incendie.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="190" y="30" class="lbl b red" text-anchor="middle">HAUTE TENSION</text><path d="M190,60 l-24,56 h20 l-14,56 l40,-72 h-22 l16,-40 z" class="sb" style="fill:var(--amber);opacity:.9;stroke:var(--text)"/><text x="190" y="210" class="lbl b" text-anchor="middle">danger d'électrocution</text><text x="190" y="230" class="lbl s" text-anchor="middle">(courant à travers votre corps)</text><line x1="380" y1="20" x2="380" y2="230" class="guide2"/><text x="570" y="30" class="lbl b red" text-anchor="middle">COURANT ÉLEVÉ</text><path d="M570,180 c-40,-20 -30,-60 -10,-90 c0,30 20,30 20,10 c10,20 30,40 10,80 z" class="sb" style="fill:var(--red);opacity:.85"/><text x="570" y="210" class="lbl b" text-anchor="middle">danger de surchauffe</text><text x="570" y="230" class="lbl s" text-anchor="middle">et d'incendie</text></svg>