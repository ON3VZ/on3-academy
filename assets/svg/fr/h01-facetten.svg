<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Que fait un radioamateur</title><desc>Quatre cases : liaisons dans le monde entier, construction, expérimentation, propagation. En dessous : pas de commerce, pas de politique ni de religion.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="30" width="350" height="110" rx="12" class="box"/><text x="195" y="72" class="lbl b" text-anchor="middle">liaisons</text><text x="195" y="98" class="lbl s" text-anchor="middle">avec des amateurs du</text><text x="195" y="116" class="lbl s" text-anchor="middle">monde entier</text><rect x="390" y="30" width="350" height="110" rx="12" class="box"/><text x="565" y="72" class="lbl b" text-anchor="middle">construire soi-même</text><text x="565" y="98" class="lbl s" text-anchor="middle">fabriquer et améliorer</text><text x="565" y="116" class="lbl s" text-anchor="middle">antennes et appareils</text><rect x="20" y="160" width="350" height="110" rx="12" class="box"/><text x="195" y="202" class="lbl b" text-anchor="middle">expérimenter</text><text x="195" y="228" class="lbl s" text-anchor="middle">nouvelles techniques</text><text x="195" y="246" class="lbl s" text-anchor="middle">et modes numériques</text><rect x="390" y="160" width="350" height="110" rx="12" class="box"/><text x="565" y="202" class="lbl b" text-anchor="middle">propagation</text><text x="565" y="228" class="lbl s" text-anchor="middle">comprendre jusqu'où</text><text x="565" y="246" class="lbl s" text-anchor="middle">portent les ondes radio</text><text x="380" y="292" class="lbl b red" text-anchor="middle">interdit : le commerce (gagner de l'argent). Tabou : politique et religion.</text></svg>