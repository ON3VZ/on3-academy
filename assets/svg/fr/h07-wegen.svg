<svg class="fig" viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg"><title>Comment une perturbation entre</title><desc>Une antenne d'émission à côté d'une maison. Le signal entre par le câble d'antenne de la télévision, le réseau électrique, les fils de haut-parleur et de téléphone, et en VHF et UHF aussi directement dans l'appareil.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="70" y1="300" x2="70" y2="110" class="wire thick"/><line x1="70" y1="110" x2="70" y2="80" class="ant"/><line x1="70" y1="92" x2="58" y2="76" class="ant"/><line x1="70" y1="92" x2="82" y2="76" class="ant"/><path d="M89.6,77.2 A16,16 0 0 1 89.6,102.8" class="w-amber"/><path d="M99.2,64.4 A32,32 0 0 1 99.2,115.6" class="w-amber"/><path d="M108.8,51.6 A48,48 0 0 1 108.8,128.4" class="w-amber"/><path d="M118.4,38.8 A64,64 0 0 1 118.4,141.2" class="w-amber"/><text x="14" y="325" class="lbl s b" text-anchor="start">votre antenne d'émission</text><path d="M300,150 L510.0,90 L720,150" class="sym"/><rect x="300" y="150" width="420" height="170" class="cell"/><text x="510" y="120" class="lbl s" text-anchor="middle">maison du voisin</text><rect x="330" y="230" width="100" height="50" rx="10" class="box"/><text x="380.0" y="260.0" class="lbl b" text-anchor="middle">TV</text><rect x="470" y="230" width="100" height="50" rx="10" class="box"/><text x="520.0" y="260.0" class="lbl b" text-anchor="middle">radio</text><rect x="610" y="230" width="90" height="50" rx="10" class="box"/><text x="655.0" y="260.0" class="lbl b" text-anchor="middle">téléphone</text><line x1="380" y1="230" x2="380" y2="170" class="wire"/><line x1="380" y1="120" x2="380" y2="90" class="wire"/><line x1="380" y1="102" x2="368" y2="86" class="wire"/><line x1="380" y1="102" x2="392" y2="86" class="wire"/><line x1="380" y1="170" x2="380" y2="120" class="wire"/><text x="392" y="165" class="lbl s" text-anchor="start">câble d'antenne TV</text><line x1="520" y1="280" x2="520" y2="312" class="wire"/><line x1="520" y1="312" x2="640" y2="312" class="wire"/><text x="580" y="306" class="lbl s" text-anchor="middle">haut-parleur</text><line x1="655" y1="230" x2="655" y2="175" class="wire"/><line x1="655" y1="175" x2="715" y2="175" class="wire"/><text x="700" y="168" class="lbl s" text-anchor="end">ligne téléphonique</text><line x1="310" y1="300" x2="330" y2="280" class="wire"/><line x1="300" y1="300" x2="300" y2="320" class="wire"/><text x="296" y="336" class="lbl s" text-anchor="end">réseau électrique</text><path d="M140,160 Q260,140 372,150" class="w-red" style="stroke-dasharray:6 5" marker-end="url(#pijl)"/><path d="M140,250 Q220,300 296,306" class="w-red" style="stroke-dasharray:6 5" marker-end="url(#pijl)"/><path d="M140,205 Q300,200 466,248" class="w-red" marker-end="url(#pijl)"/><text x="170" y="236" class="lbl s red" text-anchor="start">directement (VHF/UHF)</text><text x="380" y="30" class="lbl b" text-anchor="middle">Des fils qui ne sont pas des antennes captent quand même le signal</text></svg>