<svg class="fig" viewBox="0 0 760 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Microphone et PTT</title><desc>Un microphone avec bouton PTT et trois fils vers l'émetteur : audio, masse et PTT.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="40" y="60" width="80" height="120" rx="30" class="cell" style="stroke:var(--text);stroke-width:2"/><rect x="28" y="100" width="14" height="40" rx="4" class="box"/><text x="20" y="94" class="lbl s b" text-anchor="middle">PTT</text><text x="80" y="200" class="lbl s" text-anchor="middle">microphone</text><line x1="120" y1="80" x2="520" y2="80" class="wire"/><text x="130" y="74" class="lbl s b" text-anchor="start">audio</text><text x="220" y="74" class="lbl s" text-anchor="start">le signal de la voix (très faible)</text><line x1="120" y1="120" x2="520" y2="120" class="wire"/><text x="130" y="114" class="lbl s b" text-anchor="start">masse</text><text x="220" y="114" class="lbl s" text-anchor="start">fil commun</text><line x1="120" y1="160" x2="520" y2="160" class="wire"/><text x="130" y="154" class="lbl s b" text-anchor="start">PTT</text><text x="220" y="154" class="lbl s" text-anchor="start">bouton : émetteur marche/arrêt</text><rect x="520" y="60" width="180" height="120" rx="10" class="box"/><text x="610.0" y="107.0" class="lbl b" text-anchor="middle">émetteur</text><text x="610.0" y="125.0" class="lbl b" text-anchor="middle">prise</text><text x="610.0" y="143.0" class="lbl b" text-anchor="middle">micro</text></svg>