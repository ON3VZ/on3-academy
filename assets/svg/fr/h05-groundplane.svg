<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne ground plane</title><desc>Élément rayonnant vertical d'un quart d'onde avec quatre radians qui pendent à 45 degrés sous l'horizontale.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="230" y1="140" x2="230" y2="300" class="feed"/><line x1="230" y1="30" x2="230" y2="140" class="ant"/><line x1="230" y1="140" x2="123.935" y2="246.065" class="ant"/><line x1="230" y1="140" x2="336.065" y2="246.065" class="ant"/><line x1="230" y1="140" x2="185.5" y2="258.8" class="ant" style="opacity:.5"/><line x1="230" y1="140" x2="274.5" y2="216.4" class="ant" style="opacity:.5"/><circle cx="230" cy="140" r="4" class="symfill"/><line x1="230" y1="140" x2="356.065" y2="140" class="guide2"/><path d="M276,140 A46,46 0 0 1 262.5,172.5" class="w-amber" style="fill:none"/><text x="244" y="60" class="lbl b" text-anchor="start">élément rayonnant (λ/4)</text><text x="290" y="166" class="lbl s b accent2" text-anchor="start">45°</text><text x="270" y="292" class="lbl b" text-anchor="start">radians (λ/4 chacun)</text><text x="220" y="315" class="lbl s" text-anchor="end">coaxial vers l'émetteur</text><text x="470" y="70" class="lbl b" text-anchor="start">Un quart d'onde en haut d'un mât.</text><text x="470" y="96" class="lbl" text-anchor="start">Le sol est trop loin, ce sont donc</text><text x="470" y="118" class="lbl" text-anchor="start">des fils obliques (radians) qui</text><text x="470" y="140" class="lbl" text-anchor="start">forment le plan de sol.</text><text x="470" y="176" class="lbl s" text-anchor="start">Les radians pendent à environ 45° sous</text><text x="470" y="194" class="lbl s" text-anchor="start">l'horizontale. Le plus souvent 3 ou 4.</text><text x="470" y="222" class="lbl s" text-anchor="start">Âme du coaxial à l'élément rayonnant,</text><text x="470" y="240" class="lbl s" text-anchor="start">blindage aux radians.</text><text x="470" y="268" class="lbl s" text-anchor="start">Omnidirectionnelle, polarisation verticale.</text></svg>