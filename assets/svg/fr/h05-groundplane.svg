<svg class="fig" viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antenne ground plane</title><desc>Élément rayonnant vertical d'un quart de longueur d'onde avec des radians descendant en oblique, à environ 45 degrés.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><line x1="230" y1="30" x2="230" y2="170" class="ant"/><line x1="230" y1="170" x2="120" y2="269.0" class="ant"/><line x1="230" y1="170" x2="340" y2="269.0" class="ant"/><line x1="230" y1="170" x2="180.5" y2="285.5" class="ant"/><line x1="230" y1="170" x2="279.5" y2="285.5" class="ant"/><text x="244" y="60" class="lbl b" text-anchor="start">élément rayonnant (λ/4)</text><text x="345" y="290" class="lbl b" text-anchor="start">radians (λ/4 chacun)</text><line x1="230" y1="170" x2="230" y2="300" class="feed"/><text x="220" y="315" class="lbl s" text-anchor="end">coaxial vers l'émetteur</text><path d="M270,206 A50,50 0 0 0 282,170" class="w-amber"/><text x="300" y="200" class="lbl s b accent2" text-anchor="start">± 45°</text><text x="450" y="70" class="lbl b" text-anchor="start">Un quart d'onde en haut d'un mât.</text><text x="450" y="96" class="lbl" text-anchor="start">Le sol est trop loin, ce sont donc</text><text x="450" y="118" class="lbl" text-anchor="start">des fils obliques (radians) qui</text><text x="450" y="140" class="lbl" text-anchor="start">forment le plan de sol.</text><text x="450" y="176" class="lbl s" text-anchor="start">Omnidirectionnelle, polarisation verticale.</text></svg>