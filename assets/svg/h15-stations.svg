<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Vier soorten radiostations</title><desc>Vast: blijvend op één plaats. Transportabel: verplaatsbaar maar enkel gebruikt als het stilstaat. Mobiel: ingebouwd in een voertuig, rijdend of stilstaand. Draagbaar: los van een voertuig, in beweging of stilstaand.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="30" class="lbl s b" text-anchor="start">soort station</text><text x="220" y="30" class="lbl s b" text-anchor="start">wat is het?</text><text x="420" y="30" class="lbl s b" text-anchor="start">verplaatsbaar?</text><text x="560" y="30" class="lbl s b" text-anchor="start">gebruiken</text><rect x="10" y="46" width="740" height="54" rx="8" class="box"/><text x="24" y="79" class="lbl b mono accent2" text-anchor="start">vast</text><text x="220" y="70" class="lbl" text-anchor="start">blijvend op één</text><text x="220" y="90" class="lbl" text-anchor="start">bepaalde plaats</text><text x="450" y="79" class="lbl b" text-anchor="middle">nee</text><text x="560" y="79" class="lbl b" text-anchor="start">op die plaats</text><rect x="10" y="108" width="740" height="54" rx="8" class="cell"/><text x="24" y="141" class="lbl b mono accent2" text-anchor="start">transportabel</text><text x="220" y="132" class="lbl" text-anchor="start">kan verplaatst</text><text x="220" y="152" class="lbl" text-anchor="start">worden</text><text x="450" y="141" class="lbl b" text-anchor="middle">ja</text><text x="560" y="141" class="lbl b" text-anchor="start">enkel stilstaand</text><rect x="10" y="170" width="740" height="54" rx="8" class="box"/><text x="24" y="203" class="lbl b mono accent2" text-anchor="start">mobiel</text><text x="220" y="194" class="lbl" text-anchor="start">ingebouwd in</text><text x="220" y="214" class="lbl" text-anchor="start">een voertuig</text><text x="450" y="203" class="lbl b" text-anchor="middle">ja</text><text x="560" y="203" class="lbl b" text-anchor="start">rijdend of stilstaand</text><rect x="10" y="232" width="740" height="54" rx="8" class="cell"/><text x="24" y="265" class="lbl b mono accent2" text-anchor="start">draagbaar</text><text x="220" y="256" class="lbl" text-anchor="start">los van een</text><text x="220" y="276" class="lbl" text-anchor="start">voertuig</text><text x="450" y="265" class="lbl b" text-anchor="middle">ja</text><text x="560" y="265" class="lbl b" text-anchor="start">lopend of stilstaand</text></svg>