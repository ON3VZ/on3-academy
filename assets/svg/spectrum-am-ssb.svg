<svg class="fig" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title>Spectrum AM en SSB</title><desc>Links AM: draaggolf in het midden met een onderste en bovenste zijband. Rechts SSB: alleen de bovenste zijband blijft over.</desc><text x="195" y="24" class="lbl b" text-anchor="middle">AM: 6 kHz breed</text><line x1="20" y1="230" x2="370" y2="230" class="axis2"/><rect x="45" y="175" width="135.0" height="55" class="sb"/><rect x="210.0" y="175" width="135.0" height="55" class="sb"/><line x1="195" y1="230" x2="195" y2="70" class="carrier"/><text x="195" y="62" class="lbl s" text-anchor="middle">draaggolf 2/3</text><text x="112.5" y="168" class="lbl s" text-anchor="middle">LSB 1/6</text><text x="277.5" y="168" class="lbl s" text-anchor="middle">USB 1/6</text><line x1="45" y1="230" x2="45" y2="236" class="axis2"/><text x="45" y="252" class="lbl s mono" text-anchor="middle">7,097</text><line x1="195" y1="230" x2="195" y2="236" class="axis2"/><text x="195" y="252" class="lbl s mono" text-anchor="middle">7,100</text><line x1="345" y1="230" x2="345" y2="236" class="axis2"/><text x="345" y="252" class="lbl s mono" text-anchor="middle">7,103</text><text x="195" y="274" class="lbl s" text-anchor="middle">MHz</text><text x="575" y="24" class="lbl b" text-anchor="middle">SSB (USB): ca. 3 kHz breed</text><line x1="400" y1="230" x2="750" y2="230" class="axis2"/><line x1="575" y1="230" x2="575" y2="218" class="ghost"/><text x="575" y="212" class="lbl s" text-anchor="middle">weg</text><rect x="590.0" y="90" width="135.0" height="140" class="sb"/><text x="657.5" y="82" class="lbl s" text-anchor="middle">USB: alles</text><line x1="425" y1="230" x2="425" y2="236" class="axis2"/><text x="425" y="252" class="lbl s mono" text-anchor="middle">7,097</text><line x1="575" y1="230" x2="575" y2="236" class="axis2"/><text x="575" y="252" class="lbl s mono" text-anchor="middle">7,100</text><line x1="725" y1="230" x2="725" y2="236" class="axis2"/><text x="725" y="252" class=