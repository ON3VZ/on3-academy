<svg class="fig" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Zender en ontvanger gespiegeld</title><desc>Bovenaan de zender, onderaan de ontvanger. De demodulator doet het omgekeerde van de modulator.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="30" class="lbl b accent2" text-anchor="start">ZENDER</text><rect x="20" y="45" width="130" height="70" rx="10" class="box"/><text x="85.0" y="76.0" class="lbl b" text-anchor="middle">microfoon-</text><text x="85.0" y="94.0" class="lbl b" text-anchor="middle">versterker</text><rect x="190" y="45" width="130" height="70" rx="10" class="box"/><text x="255.0" y="85.0" class="lbl b" text-anchor="middle">modulator</text><rect x="360" y="45" width="140" height="70" rx="10" class="box"/><text x="430.0" y="76.0" class="lbl b" text-anchor="middle">RF-vermogen-</text><text x="430.0" y="94.0" class="lbl b" text-anchor="middle">versterker</text><line x1="150" y1="80" x2="188" y2="80" class="arrow" marker-end="url(#pijl)"/><line x1="320" y1="80" x2="358" y2="80" class="arrow" marker-end="url(#pijl)"/><line x1="500" y1="80" x2="600" y2="80" class="wire"/><line x1="600" y1="80" x2="600" y2="34" class="ant"/><line x1="600" y1="50" x2="584" y2="26" class="ant"/><line x1="600" y1="50" x2="616" y2="26" class="ant"/><text x="590" y="40" class="lbl s" text-anchor="end">antenne</text><path d="M650,50 q10,-10 20,0 t20,0 t20,0 t20,0" class="w-amber thickw"/><text x="690" y="74" class="lbl s" text-anchor="middle">radiogolf</text><text x="20" y="190" class="lbl b accent2" text-anchor="start">ONTVANGER</text><line x1="600" y1="280" x2="600" y2="234" class="ant"/><line x1="600" y1="250" x2="584" y2="226" class="ant"/><line x1="600" y1="250" x2="616" y2="226" class="ant"/><line x1="600" y1="280" x2="500" y2="280" class="wire"/><text x="590" y="240" class="lbl s" text-anchor="end">antenne</text><path d="M730,240 q-10,-10 -20,0 t-20,0 t-20,0 t-20,0" class="w-amber thickw"/><rect x="360" y="245" width="140" height="70" rx="10" class="box"/><text x="430.0" y="276.0" class="lbl b" text-anchor="middle">afstemming</text><text x="430.0" y="294.0" class="lbl b" text-anchor="middle">+ RF-versterking</text><rect x="190" y="245" width="130" height="70" rx="10" class="box"/><text x="255.0" y="285.0" class="lbl b" text-anchor="middle">demodulator</text><rect x="20" y="245" width="130" height="70" rx="10" class="box"/><text x="85.0" y="276.0" class="lbl b" text-anchor="middle">audio-</text><text x="85.0" y="294.0" class="lbl b" text-anchor="middle">versterker</text><line x1="358" y1="280" x2="322" y2="280" class="arrow" marker-end="url(#pijl)"/><line x1="188" y1="280" x2="152" y2="280" class="arrow" marker-end="url(#pijl)"/><line x1="255" y1="117" x2="255" y2="243" class="guide"/><text x="265" y="182" class="lbl s accent2" text-anchor="start">modulator ↔ demodulator: elkaars omgekeerde</text></svg>