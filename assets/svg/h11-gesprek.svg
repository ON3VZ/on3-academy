<svg class="fig" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg"><title>Voorbeeldgesprek met Q-codes</title><desc>Zes beurten tussen twee stations A en B met QRZ, QTH, QSL, QRP, QRM, QSY en 73, elk met uitleg.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="20" y="15" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="42" r="16" class="sb"/><text x="46" y="48" class="lbl b" text-anchor="middle">A</text><text x="74" y="39" class="lbl b mono" text-anchor="start">CQ CQ CQ, dit is ON3AAA, QRZ?</text><text x="74" y="59" class="lbl s" text-anchor="start">wie roept mij?</text><rect x="140" y="81" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="108" r="16" class="sb"/><text x="166" y="114" class="lbl b" text-anchor="middle">B</text><text x="194" y="105" class="lbl b mono" text-anchor="start">ON3AAA, dit is ON3BBB. Uw QTH?</text><text x="194" y="125" class="lbl s" text-anchor="start">wat is uw locatie?</text><rect x="20" y="147" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="174" r="16" class="sb"/><text x="46" y="180" class="lbl b" text-anchor="middle">A</text><text x="74" y="171" class="lbl b mono" text-anchor="start">Mijn QTH is Gent. Mijn rapport voor u is 59.</text><text x="74" y="191" class="lbl s" text-anchor="start">locatie en leesbaarheid</text><rect x="140" y="213" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="240" r="16" class="sb"/><text x="166" y="246" class="lbl b" text-anchor="middle">B</text><text x="194" y="237" class="lbl b mono" text-anchor="start">QSL, 59. Ik gebruik 25 W, QRP is het niet.</text><text x="194" y="257" class="lbl s" text-anchor="start">ontvangst bevestigd</text><rect x="20" y="279" width="600" height="54" rx="12" class="box"/><circle cx="46" cy="306" r="16" class="sb"/><text x="46" y="312" class="lbl b" text-anchor="middle">A</text><text x="74" y="303" class="lbl b mono" text-anchor="start">QRM hier, ik moet QSY naar 14,250.</text><text x="74" y="323" class="lbl s" text-anchor="start">storing, andere frequentie</text><rect x="140" y="345" width="600" height="54" rx="12" class="cell"/><circle cx="166" cy="372" r="16" class="sb"/><text x="166" y="378" class="lbl b" text-anchor="middle">B</text><text x="194" y="369" class="lbl b mono" text-anchor="start">QSL. 73 en tot de volgende, ON3BBB uit.</text><text x="194" y="389" class="lbl s" text-anchor="start">bevestigd, groeten</text></svg>