<svg class="fig" viewBox="0 0 760 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Ferrietring</title><desc>Een kabel die enkele keren door een ferrietring is gewikkeld. Dat remt HF-stroom op de kabel af.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><ellipse cx="230" cy="120" rx="70" ry="80" class="sym" style="stroke-width:26;stroke:var(--text3);opacity:.6"/><path d="M20,160 C120,160 150,50 230,60 C290,70 270,170 230,160 C190,150 200,80 240,90 C290,100 350,150 460,150" class="w-green" style="stroke-width:5"/><text x="230" y="232" class="lbl b" text-anchor="middle">ferrietring</text><text x="20" y="184" class="lbl s" text-anchor="start">naar het stopcontact</text><text x="460" y="174" class="lbl s" text-anchor="end">naar het toestel</text><text x="490" y="60" class="lbl" text-anchor="start">Kabel een paar keer door</text><text x="490" y="82" class="lbl" text-anchor="start">een ferrietring: dat werkt</text><text x="490" y="104" class="lbl" text-anchor="start">als smoorspoel.</text><text x="490" y="134" class="lbl b" text-anchor="start">HF-stroom: afgeremd.</text><text x="490" y="156" class="lbl b" text-anchor="start">230 V of audio: gaat door.</text><text x="490" y="190" class="lbl b green" text-anchor="start">Veilig: je knipt niets door.</text></svg>