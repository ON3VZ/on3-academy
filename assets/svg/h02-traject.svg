<svg class="fig" viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg"><title>Van kandidaat tot radioamateur</title><desc>Vijf stappen: cursus, examen, getuigschrift, bedieningscertificaat met roepnaam, stationsvergunning.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="15" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="42" r="20" class="sb"/><text x="55" y="48" class="lbl b" text-anchor="middle">1</text><text x="110" y="39" class="lbl b" text-anchor="start">Cursus volgen</text><text x="110" y="59" class="lbl s" text-anchor="start">bij een erkende vereniging (bv. UBA-sectie)</text><rect x="90" y="83" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="110" r="20" class="sb"/><text x="55" y="116" class="lbl b" text-anchor="middle">2</text><text x="110" y="107" class="lbl b" text-anchor="start">Examen afleggen</text><text x="110" y="127" class="lbl s" text-anchor="start">theorie bij het BIPT (30 vragen), praktisch deel</text><rect x="90" y="151" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="178" r="20" class="sb"/><text x="55" y="184" class="lbl b" text-anchor="middle">3</text><text x="110" y="175" class="lbl b" text-anchor="start">Getuigschrift</text><text x="110" y="195" class="lbl s" text-anchor="start">je bent geslaagd</text><rect x="90" y="219" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="246" r="20" class="sb"/><text x="55" y="252" class="lbl b" text-anchor="middle">4</text><text x="110" y="243" class="lbl b" text-anchor="start">Bedieningscertificaat + roepnaam</text><text x="110" y="263" class="lbl s" text-anchor="start">aanvragen bij het BIPT: je mag zenden (ON3...)</text><rect x="90" y="287" width="620" height="54" rx="10" class="box"/><circle cx="55" cy="314" r="20" class="sb"/><text x="55" y="320" class="lbl b" text-anchor="middle">5</text><text x="110" y="311" class="lbl b" text-anchor="start">Stationsvergunning</text><text x="110" y="331" class="lbl s" text-anchor="start">om zelf een station te hebben en te gebruiken</text></svg>