<svg class="fig" viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>S-meter</title><desc>Een S-meter met schaal S1 tot S9 en daarboven +20, +40, +60 dB. De naald staat op S9.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><path d="M215,135 A190,190 0 0 1 545,135" class="sym"/><line x1="215.45517328095664" y1="135.0" x2="227.57952893393878" y2="142.0" class="wire"/><text x="199.86671601283675" y="131.0" class="lbl b mono" text-anchor="middle">1</text><line x1="250.76717982352528" y1="90.72014435233302" x2="260.28959815231815" y2="100.98287055795058" class="wire"/><text x="238.52407054364872" y="82.52521065939615" class="lbl b mono" text-anchor="middle">3</text><line x1="297.562089567664" y1="58.81591509854036" x2="303.6364619153098" y2="71.42947924917422" class="wire"/><text x="289.7521822635479" y="47.59847547629681" class="lbl b mono" text-anchor="middle">5</text><line x1="351.68196942652685" y1="42.12214301722557" x2="353.7685611529933" y2="55.965774584377385" class="wire"/><text x="348.99920863535567" y="29.323188145173276" class="lbl b mono" text-anchor="middle">7</text><line x1="408.31803057347315" y1="42.12214301722557" x2="406.2314388470067" y2="55.965774584377385" class="wire"/><text x="411.0007913646443" y="29.323188145173276" class="lbl b mono" text-anchor="middle">9</text><line x1="462.4379104323361" y1="58.81591509854039" x2="456.3635380846903" y2="71.42947924917425" class="wire"/><text x="470.24781773645213" y="47.59847547629684" class="lbl b mono red" text-anchor="middle">+20</text><line x1="509.23282017647466" y1="90.72014435233297" x2="499.7104018476818" y2="100.98287055795055" class="wire"/><text x="521.4759294563512" y="82.5252106593961" class="lbl b mono red" text-anchor="middle">+40</text><line x1="544.5448267190434" y1="135.0" x2="532.4204710660613" y2="142.0" class="wire"/><text x="560.1332839871633" y="131.0" class="lbl b mono red" text-anchor="middle">+60</text><line x1="380" y1="230" x2="405.33718524994964" y2="61.89875954172814" class="w-red"/><circle cx="380" cy="230" r="7" class="symfill"/><text x="270" y="210" class="lbl b" text-anchor="middle">S-meter</text><text x="40" y="60" class="lbl s" text-anchor="start">elk S-punt hoger =</text><text x="40" y="78" class="lbl b" text-anchor="start">2 × zoveel spanning</text><text x="720" y="60" class="lbl s" text-anchor="end">boven S9: in dB</text><text x="720" y="78" class="lbl s" text-anchor="end">(+20, +40, +60)</text></svg>