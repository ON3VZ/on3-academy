<svg class="fig" viewBox="0 0 760 430" role="img" xmlns="http://www.w3.org/2000/svg"><title>Stappen bij een storingsklacht</title><desc>Zeven stappen van de klacht van de buur tot een controle door het NCS van het BIPT.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="90" y="20" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="43" r="18" class="sb"/><text x="60" y="49" class="lbl b" text-anchor="middle">1</text><text x="110" y="40" class="lbl b" text-anchor="start">Buur klaagt over storing</text><text x="110" y="58" class="lbl s" text-anchor="start">rustig blijven, niet afwimpelen</text><rect x="90" y="78" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="101" r="18" class="sb"/><text x="60" y="107" class="lbl b" text-anchor="middle">2</text><text x="110" y="98" class="lbl b" text-anchor="start">Samen bekijken</text><text x="110" y="116" class="lbl s" text-anchor="start">wanneer stoort het? bij welke band, welk vermogen?</text><rect x="90" y="136" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="159" r="18" class="sb"/><text x="60" y="165" class="lbl b" text-anchor="middle">3</text><text x="110" y="156" class="lbl b" text-anchor="start">Eerst je eigen station nakijken</text><text x="110" y="174" class="lbl s" text-anchor="start">zie de pagina "storing opsporen"</text><rect x="90" y="194" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="217" r="18" class="sb"/><text x="60" y="223" class="lbl b" text-anchor="middle">4</text><text x="110" y="214" class="lbl b" text-anchor="start">Hulp van de UBA-sectie</text><text x="110" y="232" class="lbl s" text-anchor="start">ervaren radioamateurs in de buurt</text><rect x="90" y="252" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="275" r="18" class="sb"/><text x="60" y="281" class="lbl b" text-anchor="middle">5</text><text x="110" y="272" class="lbl b" text-anchor="start">EMC-commissie van de UBA</text><text x="110" y="290" class="lbl s" text-anchor="start">specialisten, gratis advies</text><rect x="90" y="310" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="333" r="18" class="sb"/><text x="60" y="339" class="lbl b" text-anchor="middle">6</text><text x="110" y="330" class="lbl b" text-anchor="start">Klacht bij het BIPT</text><text x="110" y="348" class="lbl s" text-anchor="start">formulier: klacht over storingen</text><rect x="90" y="368" width="580" height="46" rx="10" class="box"/><circle cx="60" cy="391" r="18" class="sb"/><text x="60" y="397" class="lbl b" text-anchor="middle">7</text><text x="110" y="388" class="lbl b" text-anchor="start">NCS komt meten ter plaatse</text><text x="110" y="406" class="lbl s" text-anchor="start">werkt je station volgens de regels? dan niets te vrezen</text></svg>