<svg class="fig" viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title>Drie soorten frequenties</title><desc>Exclusief: één houder, hoge kwaliteit, beschermd. Gemeenschappelijk: verscheidene houders, normale kwaliteit, geen bescherming tegen de andere netten op dezelfde frequentie. Collectief: verscheidene houders overal, geen recht op kwaliteit, geen enkele bescherming.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><rect x="15" y="15" width="230" height="260" rx="12" class="box"/><text x="130" y="50" class="lbl b green" text-anchor="middle">exclusief</text><text x="130" y="90" class="lbl b" text-anchor="middle">één houder</text><text x="130" y="112" class="lbl s" text-anchor="middle">in een bepaalde zone</text><text x="130" y="175" class="lbl" text-anchor="middle">hoge dienstkwaliteit</text><text x="130" y="225" class="lbl b green" text-anchor="middle">beschermd</text><rect x="265" y="15" width="230" height="260" rx="12" class="box"/><text x="380" y="50" class="lbl b accent2" text-anchor="middle">gemeenschappelijk</text><text x="380" y="90" class="lbl b" text-anchor="middle">verscheidene houders</text><text x="380" y="112" class="lbl s" text-anchor="middle">in een zelfde zone</text><text x="380" y="130" class="lbl s" text-anchor="middle">rekening met bezetting</text><text x="380" y="175" class="lbl" text-anchor="middle">normale dienstkwaliteit</text><text x="380" y="225" class="lbl b accent2" text-anchor="middle">geen bescherming</text><rect x="515" y="15" width="230" height="260" rx="12" class="box"/><text x="630" y="50" class="lbl b red" text-anchor="middle">collectief</text><text x="630" y="90" class="lbl b" text-anchor="middle">verscheidene houders</text><text x="630" y="112" class="lbl s" text-anchor="middle">overal</text><text x="630" y="130" class="lbl s" text-anchor="middle">zonder rekening met bezetting</text><text x="630" y="175" class="lbl" text-anchor="middle">geen recht op kwaliteit</text><text x="630" y="225" class="lbl b red" text-anchor="middle">geen enkele bescherming</text><text x="380" y="252" class="lbl s" text-anchor="middle">tegen de andere netten</text><text x="630" y="252" class="lbl s" text-anchor="middle">tegen eender welke storing</text></svg>