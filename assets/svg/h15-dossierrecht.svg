<svg class="fig" viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Te laat aanvragen kost meer</title><desc>Tijdlijn: 20 werkdagen of meer voor de datum gewoon dossierrecht, minder dan 20 werkdagen het dubbele, minder dan 5 werkdagen het vijfvoudige. Bij tijdelijke vergunningen 5 en 2 werkdagen.</desc><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dimhead"/></marker><marker id="pijlas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="axhead"/></marker></defs><text x="20" y="28" class="lbl b" text-anchor="start">Aanvraag ingediend ... werkdagen voor de gewenste datum</text><line x1="40" y1="120" x2="720" y2="120" class="wire thick"/><rect x="40" y="70" width="320" height="50" class="box"/><text x="200.0" y="102" class="lbl big mono" text-anchor="middle">× 1</text><text x="200.0" y="148" class="lbl b" text-anchor="middle">20 of meer</text><text x="200.0" y="168" class="lbl s" text-anchor="middle">normaal dossierrecht</text><rect x="360" y="70" width="240" height="50" class="cell"/><text x="480.0" y="102" class="lbl big mono" text-anchor="middle">× 2</text><text x="480.0" y="148" class="lbl b" text-anchor="middle">minder dan 20</text><text x="480.0" y="168" class="lbl s" text-anchor="middle">verdubbeld</text><rect x="600" y="70" width="120" height="50" class="sb"/><text x="660.0" y="102" class="lbl big mono" text-anchor="middle">× 5</text><text x="660.0" y="148" class="lbl b" text-anchor="middle">minder dan 5</text><text x="660.0" y="168" class="lbl s" text-anchor="middle">vervijfvoudigd</text><text x="720" y="60" class="lbl s b" text-anchor="end">gewenste datum</text><text x="380" y="210" class="lbl accent2 b" text-anchor="middle">Tijdelijke vergunning: grenzen van 5 en 2 werkdagen in plaats van 20 en 5.</text><text x="380" y="236" class="lbl s" text-anchor="middle">Wijziging van een vergunning: de helft van het dossierrecht. (KB art. 35)</text></svg>